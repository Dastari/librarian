name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    # Each integration test links its own copy of the crate; with full debug info the
    # test binaries outgrew the runner's disk. Line tables keep backtraces readable.
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Free runner disk
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo check --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      # tests/media_playback.rs generates real fixtures and checks delivery with FFmpeg.
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: cargo test --locked -j 1

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run lint
        working-directory: web
      - run: pnpm test
        working-directory: web
      - run: pnpm run build
        working-directory: web

  schema-drift:
    name: GraphQL schema and generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: backend
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: Export schema
        run: >-
          EXPORT_GRAPHQL_SCHEMA=${{ runner.temp }}/librarian.graphql
          cargo test --locked --lib -j 1 services::graphql::schema::tests::schema_builds_without_recursing
          -- --exact
        working-directory: backend
      - name: Test vendored macro expansion and schema-export stubs
        run: |
          cargo test --locked -p graphql-orm-macros --lib -j 1
          # Features cannot be selected on a non-member package; test the export-only build from its own manifest and lockfile.
          cargo test --locked --manifest-path ../vendor/graphql-orm-macros/Cargo.toml --target-dir target/vendor-macros --features schema-export-only --lib -j 1
        working-directory: backend
      - name: Require tooling export to match the normal runtime schema
        run: |
          cargo build --locked --example export-schema --features schema-export-only -j 1
          ./target/debug/examples/export-schema "${{ runner.temp }}/librarian-tooling.graphql"
          diff -u "${{ runner.temp }}/librarian.graphql" "${{ runner.temp }}/librarian-tooling.graphql"
        working-directory: backend
      - name: Regenerate client
        run: cp ${{ runner.temp }}/librarian.graphql schema.graphql && pnpm codegen
        working-directory: web
      - name: Reject schema drift
        run: >-
          git diff --exit-code --
          web/schema.graphql
          web/src/graphql/entities
      - name: Verify registered-root and generated-document coverage
        run: pnpm run codegen:check
        working-directory: web

  security:
    name: Supply-chain and secret policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2
        with:
          tool: cargo-audit,cargo-deny,cargo-machete
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cargo audit
        working-directory: backend
      - run: cargo deny check
        working-directory: backend
      - run: cargo machete
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm run audit:ci
        working-directory: web
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  windows-check:
    name: Windows compile
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          workspaces: backend
      - run: cargo check --locked --all-targets

  sbom:
    name: Build SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: librarian.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: librarian-sbom
          path: librarian.cdx.json

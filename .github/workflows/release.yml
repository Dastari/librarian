name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g., v1.0.0)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == format('refs/tags/{0}', github.event.inputs.tag) || startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  build-distro-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Build frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build backend
        run: |
          cd backend
          cargo build --locked --release --features embed-frontend

      - name: Package Linux artifacts
        id: package
        run: |
          VERSION=$(rg -n '^version\\s*=\\s*"' backend/Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\\1/')
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist/linux
          cp backend/target/release/librarian dist/linux/librarian
          tar -czf dist/librarian-${VERSION}-linux-x86_64.tar.gz -C dist/linux librarian
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distro-linux
          path: dist/*

  build-windows-server:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build frontend
        shell: bash
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Build backend
        shell: bash
        run: |
          cd backend
          cargo build --locked --release --features embed-frontend --target x86_64-pc-windows-msvc

      - name: Package portable Windows server
        shell: powershell
        run: |
          $version = (Select-String -Path backend/Cargo.toml -Pattern '^version\\s*=\\s*"' | Select-Object -First 1).Line
          $version = $version -replace '.*"([^"]+)".*','$1'
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force -Path "$dist\\windows\\x86_64" | Out-Null
          Copy-Item "backend\\target\\x86_64-pc-windows-msvc\\release\\librarian.exe" "$dist\\windows\\x86_64\\librarian.exe"
          Set-Content -Path "$dist\\windows\\x86_64\\README.txt" -Value "Portable Librarian server build. Windows service and tray modes are not supported. Install ffmpeg/ffprobe separately and run librarian.exe in server mode."
          Compress-Archive -Path "$dist\\windows\\x86_64\\librarian.exe","$dist\\windows\\x86_64\\README.txt" -DestinationPath "$dist\\librarian-$version-windows-server-x86_64.zip" -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-server
          path: dist/*

  create-release:
    needs: [build-and-push, build-distro-linux, build-windows-server]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify version matches tag
        run: |
          VERSION=$(rg -n '^version\\s*=\\s*"' backend/Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\\1/')
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Cargo version ($VERSION) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          generate_release_notes: true
          files: |
            dist/**
          body: |
            ## Docker Image

            Pull the image:
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ```

            ## Quick Start

            1. Download the docker-compose file:
            ```bash
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.dist.yml
            ```

            2. Create a `.env` file:
            ```bash
            echo "JWT_SECRET=$(openssl rand -hex 32)" > .env
            echo "INDEXER_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> .env
            ```

            3. Start the application:
            ```bash
            docker compose -f docker-compose.dist.yml up -d
            ```

            4. Open http://localhost:3000 and create your admin account.

            ## Portable builds

            `librarian-<version>-linux-x86_64.tar.gz` and `librarian-<version>-windows-server-x86_64.zip` contain a single binary with the web app embedded; run it in server mode and open http://localhost:3000.

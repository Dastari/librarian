<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backend alignment sequence</title><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent;color:var(--foreground,#18232d);font-family:var(--font-sans,system-ui,sans-serif)}body{font-size:14px;line-height:1.5}button{font:inherit;cursor:pointer}.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}.filters button{border:1px solid var(--border,#ccd2da);border-radius:var(--radius,8px);background:transparent;color:inherit;padding:7px 12px}.filters button[aria-pressed=true]{background:var(--primary,#295eae);color:var(--primary-foreground,#fff);border-color:transparent}button:focus-visible,summary:focus-visible{outline:2px solid var(--ring,#568ddf);outline-offset:3px}.hint{margin:0 0 14px;color:var(--muted-foreground,#5f6c78);font-size:13px}.stage{border-top:1px solid var(--border,#d3d8de);padding:12px 0}summary{display:flex;gap:12px;align-items:center;cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}.num{flex:0 0 30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--secondary,#e8edf2);color:var(--secondary-foreground,#283747);font-size:12px;font-weight:700}.heading{flex:1;min-width:0}strong{display:block;font-size:14px;font-weight:650}.dep{display:block;font-size:12px;color:var(--muted-foreground,#63717f)}.plus{flex:0 0 18px;text-align:center;color:var(--muted-foreground,#63717f)}.plus::after{content:"+"}details[open] .plus::after{content:"−"}.detail{padding:12px 0 0 42px}.detail p{margin:0 0 10px}.gate{padding:12px 16px;border-radius:var(--radius,8px);background:var(--accent-surface,var(--secondary,#e8edf2));color:var(--accent-surface-foreground,var(--foreground,#283747));font-size:13px}.gate b{font-weight:650}.note{font-size:12px;color:var(--muted-foreground,#63717f);margin:16px 0 0}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px;font-size:12px;color:var(--muted-foreground,#63717f)}.legend span{display:inline-flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--primary,#295eae)}.dot.product{background:var(--chart-3,#8660af)}details[data-group=product] .num{box-shadow:inset 0 0 0 1px var(--chart-3,#8660af)}[hidden]{display:none!important}@media(max-width:420px){.detail{padding-left:0}.filters button{padding:7px 9px}strong{font-size:13px}}
</style></head><body><nav class="filters" aria-label="Implementation scope"><button type="button" data-scope="core" aria-pressed="true">Core alignment</button><button type="button" data-scope="product" aria-pressed="false">Media features</button><button type="button" data-scope="all" aria-pressed="false">All waves</button></nav><p class="hint">Expand a wave for its work and acceptance gate. Sequence shows dependencies, not time estimates.</p><main id="waves" aria-label="Backend implementation waves"></main><p class="note">Audit and plan only · 24 October 2026 · Runtime/schema qualification is pending. No application or live-data changes were made for this audit.</p><script>
const waves=[[0, "core", "Qualify the pinned runtime", "Export the real schema; fix managed-object restore; rehearse migration and rollback on disposable data.", "An adequate runner passes Rust/API/auth/subscription checks and a byte-verified empty-store restore.", "Start here"], [1, "core", "Close access and transaction gaps", "Scope torrent reads/actions/events; authorize library imports, quality work and source-grading targets; enforce query purity and safe retries; make auth rotation atomic.", "Two-owner negative tests and concurrent token/invite tests pass.", "After baseline"], [2, "core", "Make generated reads efficient", "Implement complete owner predicates, correct Collection membership and qualify batched nested reads.", "Authorized pages/counts agree with policy; query work remains bounded.", "After access policy"], [3, "core", "Complete relations and parent events", "Restore torrentChanged; add missing relations, deletion/reparent revisions, explicit cleanup and stored-availability backfill.", "Commit/rollback, cascade, bulk and nullable-parent delivery tests pass.", "After access + reads"], [4, "core", "Make active views subscription driven", "Share scoped listeners; register snapshot refresh callbacks; recover after reconnect/lag and authority changes; remove the two domain polls.", "Two clients stay current while infinite windows, focus and scoped caches survive.", "After each domain\u2019s event tests"], [5, "core", "Complete large datasets", "Add real per-source continuation, targeted keyset/aggregate roots and authoritative resume projections.", "Multiple batches, partial failures, concurrent changes and retry behave honestly.", "After predicates + events"], [6, "product", "Personal collections and shelves", "Add owned saved rules, manual lists, Watch Later and home/library preferences.", "Generated CRUD and cross-client updates preserve viewing/acquisition boundaries.", "After core data contracts"], [7, "product", "Versions and playback identity", "Model alternate files/editions, migrate progress identity and preserve legacy links.", "Cuts remain distinct; playback, matching and progress migrations are compatible.", "After access + event foundation"], [8, "product", "Listening and media analysis", "Add audiobook bookmarks and typed intro/credit markers with bounded analysis jobs.", "Bookmark isolation, marker provenance and manual overrides are verified.", "After version identity"], [9, "product", "Managed offline media", "Add device manifests, transfer queues, expiry/quota and progress reconciliation.", "Actual offline playback and reconnect/conflict/revocation cases pass.", "After versions + recovery"], [10, "product", "Finish declared capability gaps", "Implement RSS/Usenet workflows and decide separate protocol/platform milestones.", "Workers and end-to-end tests exist before capabilities are advertised.", "After acquisition foundation"], [11, "core", "Enforce and release", "Extend schema/root/codegen checks, exception and polling/SQL ratchets, performance budgets and release rehearsal.", "Selected scope passes the final checklist; new runtime and frontend qualify together.", "Ratchets begin early; release last"]];
const root=document.getElementById('waves');for(const [id,group,title,work,gate,dep] of waves){const el=document.createElement('details');el.className='stage';el.dataset.group=group;el.hidden=group!=='core';el.open=id===1;const summary=document.createElement('summary');const num=document.createElement('span');num.className='num';num.textContent=id;const label=document.createElement('span');label.className='heading';const strong=document.createElement('strong');strong.textContent=title;const dependency=document.createElement('span');dependency.className='dep';dependency.textContent=dep;label.append(strong,dependency);const plus=document.createElement('span');plus.className='plus';plus.setAttribute('aria-hidden','true');plus.textContent='';summary.append(num,label,plus);const detail=document.createElement('div');detail.className='detail';const para=document.createElement('p');para.textContent=work;const accept=document.createElement('div');accept.className='gate';const b=document.createElement('b');b.textContent='Gate: ';accept.append(b,document.createTextNode(gate));detail.append(para,accept);el.append(summary,detail);root.append(el)}
for(const button of document.querySelectorAll('button[data-scope]'))button.addEventListener('click',()=>{for(const peer of document.querySelectorAll('button[data-scope]'))peer.setAttribute('aria-pressed',String(peer===button));for(const stage of root.children)stage.hidden=button.dataset.scope!=='all'&&stage.dataset.group!==button.dataset.scope});
</script></body></html>

mutation CreateDirectory($input: CreateDirectoryInput!) {
  createDirectory(input: $input) {
    success
    error
    affectedCount
    messages
    path
  }
}

subscription FilesystemChanged($path: String) {
  filesystemChanged(path: $path) {
    path
    changeType
    name
    newName
    timestamp
  }
}

query MediaFileDetail($id: String!) {
  mediaFile(id: $id) {
    ...MediaFileFields
    ...LinkedMediaFile
  }
}

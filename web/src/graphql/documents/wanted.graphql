# Cross-library lists for the Wanted page. Every row carries its parent title and artwork so
# the page can group by title without a second round trip.

query WantedListEpisodes($where: EpisodeWhereInput, $page: PageInput) {
  episodes(where: $where, orderBy: [{ season: ASC }, { episode: ASC }], page: $page) {
    edges {
      node {
        ...EpisodeFields
        show {
          id
          name
          posterUrl
          libraryId
          imdbId
        }
      }
    }
    pageInfo {
      hasNextPage
      totalCount
    }
  }
}

query WantedListMovies($where: MovieWhereInput, $page: PageInput) {
  movies(where: $where, orderBy: [{ sortTitle: ASC }], page: $page) {
    edges {
      node {
        ...MovieFields
      }
    }
    pageInfo {
      hasNextPage
      totalCount
    }
  }
}

query WantedListTracks($where: TrackWhereInput, $page: PageInput) {

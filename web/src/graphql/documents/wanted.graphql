# Files the quality engine marked as below their profile. The Wanted page resolves the owning
# episode/movie/track/chapter in a second step.
query UpgradableFiles($page: PageInput) {
  mediaFiles(where: { qualityStatus: { eq: "suboptimal" } }, orderBy: [{ addedAt: DESC }], page: $page) {
    edges {
      node {
        id
        libraryId
        episodeId
        movieId
        trackId
        chapterId
        resolution
        videoCodec
        audioCodec
        size
        qualityStatus
      }
    }
    pageInfo {
      hasNextPage
      totalCount
    }
  }
}

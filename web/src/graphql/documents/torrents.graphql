fragment LiveTorrentFields on LiveTorrent {
  id
  infoHash
  name
  state
  progress
  size
  downloaded
  uploaded
  downloadSpeed
  uploadSpeed
  peers
  savePath
}

query LiveTorrents {
  liveTorrents {
    ...LiveTorrentFields
    files {
      index
      path
      size
      progress
    }
  }
}

query LiveTorrent($id: Int!) {
  liveTorrent(id: $id) {
    ...LiveTorrentFields
    files {
      index
      path
      size
      progress
    }
  }
}

subscription TorrentProgress {
  torrentProgress {
    id
    infoHash
    progress
    downloadSpeed
    uploadSpeed
    peers
    state
  }
}

subscription TorrentAdded {
  torrentAdded {
    id
    name
    infoHash
  }
}

subscription TorrentCompleted {
  torrentCompleted {
    id
    name
    infoHash
  }
}

subscription TorrentRemoved {
  torrentRemoved {
    id
    infoHash
  }
}

mutation AddTorrent($input: AddTorrentInput!) {
  addTorrent(input: $input) {
    success
    error
    torrent {
      ...LiveTorrentFields
    }
  }
}

mutation PauseTorrent($id: Int!) {
  pauseTorrent(id: $id) {
    success
    error
  }
}

mutation ResumeTorrent($id: Int!) {
  resumeTorrent(id: $id) {
    success
    error
  }
}

mutation RemoveTorrent($id: Int!, $deleteFiles: Boolean!) {
  removeTorrent(id: $id, deleteFiles: $deleteFiles) {
    success
    error
  }
}

mutation ProcessSource($sourceId: String!, $sourceType: String!) {
  processSource(sourceId: $sourceId, sourceType: $sourceType) {
    success
    filesProcessed
    filesFailed
    messages
    error
  }
}

mutation RematchSource($sourceId: String!, $sourceType: String!, $libraryId: String) {
  rematchSource(sourceId: $sourceId, sourceType: $sourceType, libraryId: $libraryId) {
    success
    matchCount
    error
  }
}

# The Downloads table: stored torrents (server-side filters, sorting and batches) with what
# each was grabbed for, named for entity chips. Live speeds and progress come from
# LiveTorrents and the TorrentProgress subscription, joined by info hash.
query DownloadsTable($where: TorrentWhereInput, $orderBy: [TorrentOrderByInput!], $page: PageInput) {
  torrents(where: $where, orderBy: $orderBy, page: $page) {
    edges {
      node {
        ...TorrentFields
        library {
          id
          name
          libraryType
        }
        movie {
          id
          title
          year
        }
        show {
          id
          name
        }
        episode {
          id
          showId
          season
          episode
          title
        }
        album {
          id
          name
        }
        audiobook {
          id
          title
        }
      }
    }
    pageInfo {
      hasNextPage
      totalCount
    }
  }
}

# Counts for the filter presets, independent of the table's own filters.
query DownloadCounts {
  all: torrents(page: { limit: 1, offset: 0 }) { pageInfo { totalCount } }
  downloading: torrents(where: { state: { inList: ["downloading", "checking", "initializing", "queued"] } }, page: { limit: 1, offset: 0 }) { pageInfo { totalCount } }
  seeding: torrents(where: { state: { eq: "seeding" } }, page: { limit: 1, offset: 0 }) { pageInfo { totalCount } }
  paused: torrents(where: { state: { eq: "paused" } }, page: { limit: 1, offset: 0 }) { pageInfo { totalCount } }
  failed: torrents(where: { or: [{ state: { eq: "error" } }, { postProcessStatus: { eq: "failed" } }] }, page: { limit: 1, offset: 0 }) { pageInfo { totalCount } }
}

query PendingUpgradeNotifications($where: NotificationWhereInput = {actionType: {eq: "quality_upgrade"}, resolvedAt: {isNull: true}}, $page: PageInput) {
  notifications(where: $where, page: $page, orderBy: [{createdAt: DESC}]) {
    edges { node { ...NotificationFields } }
    pageInfo { hasNextPage totalCount }
  }
}

mutation ApproveQualityUpgrade($notificationId: String!) {
  approveQualityUpgrade(notificationId: $notificationId) {
    success
    error
  }
}

query UnresolvedScanIssues($limit: Int!, $offset: Int!) {
  libraryScanIssues(where: { resolvedAt: { isNull: true } }, orderBy: [{ createdAt: DESC }], page: { limit: $limit, offset: $offset }) {
    edges {
      node {
        ...LibraryScanIssueFields
      }
    }
    pageInfo {
      hasNextPage
      totalCount
    }
  }
}

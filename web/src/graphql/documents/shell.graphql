# Same states as the Downloads page's "downloading" preset, read from the stored torrents
# (which the torrent service syncs every ~10 seconds) under the caller's own row policy.
query ActiveDownloadCount {
  downloading: torrents(where: { state: { inList: ["downloading", "checking", "initializing", "queued"] } }, page: { limit: 1, offset: 0 }) {
    pageInfo {
      totalCount
    }
  }
}

query UnreadNotificationCount {
  notifications(where: { readAt: { isNull: true }, resolvedAt: { isNull: true } }, page: { limit: 1, offset: 0 }) {
    pageInfo {
      totalCount
    }
  }
}

query NavLibraries {
  libraries(orderBy: [{ name: ASC }], page: { limit: 100, offset: 0 }) {
    edges {
      node {
        id
        name
        libraryType
        icon
        color
        scanning
      }
    }
  }
}

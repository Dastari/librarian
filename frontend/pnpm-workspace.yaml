allowBuilds:
  '@heroui/shared-utils': true
  data-table-pro@https://codeload.github.com/Dastari/data-table-pro/tar.gz/758c39dcd8c40a8b198c4d75c3242cf1cc8ed08d: true
  esbuild: true
overrides:
  '@rolldown/binding-wasm32-wasi>@napi-rs/wasm-runtime': '1.1.6'
  # Keep Babel 7 consumers on their supported API (Router's dev splitter uses Scope.references).
  '@babel/core@<8': '^7.29.7'
  brace-expansion: '>=5.0.8'
  immutable: '>=5.1.9'
  js-yaml: '>=4.3.0'
  launch-editor: '>=2.14.1'
  'picomatch@<3.0.0': '2.3.2'
  postcss: '>=8.5.25'
  seroval: '>=1.6.0'
  shell-quote: '>=1.10.0'
  vite: '8.2.2'
  ws: '>=8.21.1'
  yaml: '>=2.9.0'
minimumReleaseAgeExclude:
  - postcss@8.5.25
  - seroval@1.6.0
  - jsdom@30.0.1

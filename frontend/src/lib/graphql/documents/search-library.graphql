query LibrarySearchShows {
  Shows {
    Edges {
      Node {
        Id
        LibraryId
        Name
        Year
        PosterUrl
      }
    }
  }
}

query LibrarySearchMovies {
  Movies {
    Edges {
      Node {
        Id
        LibraryId
        Title
        Year
        PosterUrl
        Status
      }
    }
  }
}

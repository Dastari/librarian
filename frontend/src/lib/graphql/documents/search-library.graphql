query LibrarySearchShows {
  shows {
    edges {
      node {
        id
        libraryId
        name
        year
        posterUrl
      }
    }
  }
}

query LibrarySearchMovies {
  movies {
    edges {
      node {
        id
        libraryId
        title
        year
        mediaFileId
        wanted
      }
    }
  }
}

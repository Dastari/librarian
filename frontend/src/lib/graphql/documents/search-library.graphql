query LibrarySearchShows {
  Shows: shows {
    Edges: edges {
      Node: node {
        Id
        LibraryId
        Name
        Year
        PosterUrl
      }
    }
  }
}

query LibrarySearchMovies {
  Movies: movies {
    Edges: edges {
      Node: node {
        Id
        LibraryId
        Title
        Year
        MediaFileId
        Wanted
      }
    }
  }
}

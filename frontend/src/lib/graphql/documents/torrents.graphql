query ActiveDownloadCount {
  activeDownloadCount
}

query TorrentModalMediaFilesByPaths($paths: [String!]!) {
  mediaFiles(
    where: { path: { inList: $paths } }
    page: { limit: 1000, offset: 0 }
  ) {
    edges {
      node {
        id
        path
        metadata
      }
    }
  }
}

query DownloadsTorrents($where: TorrentWhereInput, $page: PageInput) {
  torrents(where: $where, page: $page) {
    edges {
      node {
        id
        infoHash
        name
        state
        progress
        totalBytes
        downloadedBytes
        uploadedBytes
        savePath
        addedAt
      }
    }
    pageInfo {
      totalCount
      hasNextPage
    }
  }
}

query TorrentByInfoHashWithFiles($where: TorrentWhereInput, $page: PageInput) {
  torrents(where: $where, page: $page) {
    edges {
      node {
        id
        infoHash
        name
        state
        progress
        totalBytes
        downloadedBytes
        uploadedBytes
        savePath
        addedAt
        files(page: { limit: 500 }) {
          edges {
            node {
              fileIndex
              filePath
              fileSize
              downloadedBytes
              progress
            }
          }
        }
      }
    }
  }
}

query PendingFileMatchesBySource(
  $where: PendingFileMatchWhereInput
  $page: PageInput
) {
  pendingFileMatches(where: $where, page: $page) {
    edges {
      node {
        id
        sourceType
        sourceId
        sourceFileIndex
        sourcePath
        fileSize
        episodeId
        movieId
        trackId
        chapterId
        matchType
        matchConfidence
        parsedResolution
        parsedCodec
        parsedSource
        parsedAudio
        copiedAt
        copyError
      }
    }
  }
}

mutation PauseTorrentByInfoHash($infoHash: String!) {
  pauseTorrentByInfoHash(infoHash: $infoHash) {
    success
    error
  }
}

mutation ResumeTorrentByInfoHash($infoHash: String!) {
  resumeTorrentByInfoHash(infoHash: $infoHash) {
    success
    error
  }
}

mutation RemoveTorrentByInfoHash($infoHash: String!, $deleteFiles: Boolean) {
  removeTorrentByInfoHash(infoHash: $infoHash, deleteFiles: $deleteFiles) {
    success
    error
  }
}

mutation ProcessSource($sourceType: String!, $sourceId: String!) {
  processSource(sourceType: $sourceType, sourceId: $sourceId) {
    success
    filesProcessed
    filesFailed
    messages
    error
  }
}

mutation RematchSource(
  $sourceType: String!
  $sourceId: String!
  $libraryId: String
) {
  rematchSource(
    sourceType: $sourceType
    sourceId: $sourceId
    libraryId: $libraryId
  ) {
    success
    matchCount
    error
  }
}

mutation LinkTorrentToLibrary($id: String!, $input: UpdateTorrentInput!) {
  updateTorrent(id: $id, input: $input) {
    success
    error
    torrent {
      id
      libraryId
    }
  }
}

subscription TorrentProgress {
  torrentProgress {
    id
    infoHash
    progress
    downloadSpeed
    uploadSpeed
    peers
    state
  }
}

subscription TorrentAdded {
  torrentAdded {
    id
    name
    infoHash
  }
}

subscription TorrentRemoved {
  torrentRemoved {
    id
    infoHash
  }
}

subscription TorrentCompleted {
  torrentCompleted {
    id
    name
    infoHash
  }
}

subscription TorrentFileChanged($filter: SubscriptionFilterInput) {
  torrentFileChanged(filter: $filter) {
    action
    id
    torrentFile {
      torrentId
      fileIndex
      filePath
      fileSize
      downloadedBytes
      progress
    }
  }
}

mutation CreateUnmatchedMediaFileFromTorrent($input: CreateMediaFileInput!) {
  createMediaFile(input: $input) {
    success
    error
    mediaFile {
      id
      path
      metadata
    }
  }
}

query TorrentMatchLibrariesRuntime {
  libraries(page: { limit: 1000, offset: 0 }) {
    edges {
      node {
        id
        name
        libraryType
      }
    }
  }
}

query TorrentMatchMediaFilesByPathsRuntime($paths: [String!]!) {
  mediaFiles(
    where: { path: { inList: $paths } }
    page: { limit: 1000, offset: 0 }
  ) {
    edges {
      node {
        id
        path
        metadata
        libraryId
        episodeId
        movieId
        trackId
        chapterId
      }
    }
  }
}

mutation TorrentFindMatchForMediaFileRuntime($input: MatchMediaFileInput!) {
  matchMediaFile(input: $input) {
    success
    autoMatched
    alreadyMatched
    matchedType
    matchedId
    confidence
    reason
    candidates {
      targetType
      targetId
      targetName
      score
      reason
      wanted
    }
  }
}

mutation TorrentUnmatchMediaFileRuntime($mediaFileId: String!) {
  unmatchMediaFile(mediaFileId: $mediaFileId) {
    success
    reason
  }
}

query TorrentMatchCandidateArtworkRuntime(
  $movieIds: [String!]!
  $episodeIds: [String!]!
  $showIds: [String!]!
  $trackIds: [String!]!
  $albumIds: [String!]!
  $chapterIds: [String!]!
  $audiobookIds: [String!]!
) {
  movies(where: { id: { inList: $movieIds } }, page: { limit: 1000, offset: 0 }) {
    edges {
      node {
        id
        posterUrl: collectionPosterUrl
      }
    }
  }
  episodes(
    where: { id: { inList: $episodeIds } }
    page: { limit: 1000, offset: 0 }
  ) {
    edges {
      node {
        id
        showId
      }
    }
  }
  shows(where: { id: { inList: $showIds } }, page: { limit: 1000, offset: 0 }) {
    edges {
      node {
        id
        posterUrl
      }
    }
  }
  tracks(where: { id: { inList: $trackIds } }, page: { limit: 1000, offset: 0 }) {
    edges {
      node {
        id
        albumId
      }
    }
  }
  albums(where: { id: { inList: $albumIds } }, page: { limit: 1000, offset: 0 }) {
    edges {
      node {
        id
        coverUrl
      }
    }
  }
  chapters(
    where: { id: { inList: $chapterIds } }
    page: { limit: 1000, offset: 0 }
  ) {
    edges {
      node {
        id
        audiobookId
      }
    }
  }
  audiobooks(
    where: { id: { inList: $audiobookIds } }
    page: { limit: 1000, offset: 0 }
  ) {
    edges {
      node {
        id
        coverUrl
      }
    }
  }
}

mutation DeletePendingFileMatchFromTorrentModal($id: String!) {
  deletePendingFileMatch(id: $id) {
    success
    error
  }
}

mutation AnalyzeMediaFileForTorrent($mediaFileId: String!, $path: String!) {
  analyzeMediaFile(mediaFileId: $mediaFileId, path: $path) {
    success
    queued
    message
  }
}

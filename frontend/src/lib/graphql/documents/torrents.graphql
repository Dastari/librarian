query ActiveDownloadCount {
  ActiveDownloadCount
}

query TorrentModalMediaFilesByPaths($Paths: [String!]!) {
  MediaFiles: mediaFiles(
    where: { Path: { inList: $Paths } }
    page: { limit: 1000, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        Path
        Metadata
      }
    }
  }
}

query DownloadsTorrents($Where: TorrentWhereInput, $Page: PageInput) {
  Torrents: torrents(where: $Where, page: $Page) {
    Edges: edges {
      Node: node {
        Id
        InfoHash
        Name
        State
        Progress
        TotalBytes
        DownloadedBytes
        UploadedBytes
        SavePath
        AddedAt
      }
    }
    PageInfo: pageInfo {
      TotalCount: totalCount
      HasNextPage: hasNextPage
    }
  }
}

query TorrentByInfoHashWithFiles($Where: TorrentWhereInput, $Page: PageInput) {
  Torrents: torrents(where: $Where, page: $Page) {
    Edges: edges {
      Node: node {
        Id
        InfoHash
        Name
        State
        Progress
        TotalBytes
        DownloadedBytes
        UploadedBytes
        SavePath
        AddedAt
        Files: files(page: { limit: 500 }) {
          Edges: edges {
            Node: node {
              FileIndex
              FilePath
              FileSize
              DownloadedBytes
              Progress
            }
          }
        }
      }
    }
  }
}

query PendingFileMatchesBySource(
  $Where: PendingFileMatchWhereInput
  $Page: PageInput
) {
  PendingFileMatches: pendingFileMatches(where: $Where, page: $Page) {
    Edges: edges {
      Node: node {
        Id
        SourceType
        SourceId
        SourceFileIndex
        SourcePath
        FileSize
        EpisodeId
        MovieId
        TrackId
        ChapterId
        MatchType
        MatchConfidence
        ParsedResolution
        ParsedCodec
        ParsedSource
        ParsedAudio
        CopiedAt
        CopyError
      }
    }
  }
}

mutation PauseTorrentByInfoHash($InfoHash: String!) {
  PauseTorrentByInfoHash(InfoHash: $InfoHash) {
    Success
    Error
  }
}

mutation ResumeTorrentByInfoHash($InfoHash: String!) {
  ResumeTorrentByInfoHash(InfoHash: $InfoHash) {
    Success
    Error
  }
}

mutation RemoveTorrentByInfoHash($InfoHash: String!, $DeleteFiles: Boolean) {
  RemoveTorrentByInfoHash(InfoHash: $InfoHash, DeleteFiles: $DeleteFiles) {
    Success
    Error
  }
}

mutation ProcessSource($SourceType: String!, $SourceId: String!) {
  ProcessSource(SourceType: $SourceType, SourceId: $SourceId) {
    Success
    FilesProcessed
    FilesFailed
    Messages
    Error
  }
}

mutation RematchSource(
  $SourceType: String!
  $SourceId: String!
  $LibraryId: String
) {
  RematchSource(
    SourceType: $SourceType
    SourceId: $SourceId
    LibraryId: $LibraryId
  ) {
    Success
    MatchCount
    Error
  }
}

mutation LinkTorrentToLibrary($Id: String!, $Input: UpdateTorrentInput!) {
  UpdateTorrent: updateTorrent(id: $Id, input: $Input) {
    Success: success
    Error: error
    Torrent: torrent {
      Id
      LibraryId
    }
  }
}

subscription TorrentChanged {
  TorrentChanged: torrentProgress {
    Id: id
  }
}

mutation CreateUnmatchedMediaFileFromTorrent($Input: CreateMediaFileInput!) {
  CreateMediaFile: createMediaFile(input: $Input) {
    Success: success
    Error: error
    MediaFile: mediaFile {
      Id
      Path
      Metadata
    }
  }
}

mutation AnalyzeMediaFileForTorrent($MediaFileId: String!, $Path: String!) {
  AnalyzeMediaFile(MediaFileId: $MediaFileId, Path: $Path) {
    Success
    Queued
    Message
  }
}

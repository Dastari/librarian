query AlbumDetailRoute($Id: String!) {
  Album: album(id: $Id) {
    Id
    ArtistId
    LibraryId
    Name
    SortName
    Year
    MusicbrainzId
    AlbumType
    Genres
    Label
    Country
    ReleaseDate
    CoverUrl
    TrackCount
    DiscCount
    TotalDurationSecs
    HasFiles
    SizeBytes
    Path
  }
  Tracks: tracks(
    where: { AlbumId: { eq: $Id } }
    page: { limit: 5000, offset: 0 }
    orderBy: [{ DiscNumber: ASC }, { TrackNumber: ASC }]
  ) {
    Edges: edges {
      Node: node {
        Id
        AlbumId
        LibraryId
        Title
        TrackNumber
        DiscNumber
        MusicbrainzId
        Isrc
        DurationSecs
        Explicit
        ArtistName
        ArtistId
        MediaFileId
        Wanted
      }
    }
  }
}

mutation DeleteAlbumRoute($Id: String!) {
  DeleteAlbum: deleteAlbum(id: $Id) {
    Success: success
    Error: error
  }
}

mutation AlbumDetailSetTrackWanted($AlbumId: String!, $Wanted: Boolean!) {
  UpdateTracks: updateTracks(
    where: { AlbumId: { eq: $AlbumId } }
    input: { Wanted: $Wanted }
  ) {
    success
    error
    affectedCount
  }
}

query AudiobookDetailRoute($Id: String!) {
  Audiobook: audiobook(id: $Id) {
    Id
    LibraryId
    Title
    SortTitle
    Isbn
    Description
    Publisher
    Language
    Narrators
    TotalDurationSecs
    CoverUrl
    HasFiles
    SizeBytes
    Path
    Chapters: chapters(page: { limit: 5000, offset: 0 }) {
      Edges: edges {
        Node: node {
          Id
          AudiobookId
          ChapterNumber
          Title
          StartTimeSecs
          EndTimeSecs
          DurationSecs
          MediaFileId
          Wanted
        }
      }
    }
  }
}

mutation DeleteAudiobookRoute($Id: String!) {
  DeleteAudiobook: deleteAudiobook(id: $Id) {
    Success: success
    Error: error
  }
}

mutation AudiobookDetailSetChapterWanted(
  $AudiobookId: String!
  $Wanted: Boolean!
) {
  UpdateChapters: updateChapters(
    where: { AudiobookId: { eq: $AudiobookId } }
    input: { Wanted: $Wanted }
  ) {
    success
    error
    affectedCount
  }
}

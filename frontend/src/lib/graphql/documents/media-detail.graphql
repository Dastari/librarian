query AlbumDetailRoute($id: String!) {
  album(id: $id) {
    id
    artistId
    libraryId
    name
    sortName
    year
    musicbrainzId
    albumType
    genres
    label
    country
    releaseDate
    coverUrl
    trackCount
    discCount
    totalDurationSecs
    hasFiles
    sizeBytes
    path
  }
  tracks(
    where: { albumId: { eq: $id } }
    page: { limit: 5000, offset: 0 }
    orderBy: [{ discNumber: ASC }, { trackNumber: ASC }]
  ) {
    edges {
      node {
        id
        albumId
        libraryId
        title
        trackNumber
        discNumber
        musicbrainzId
        isrc
        durationSecs
        explicit
        artistName
        artistId
        mediaFileId
        wanted
      }
    }
  }
}

mutation DeleteAlbumRoute($id: String!) {
  deleteAlbum(id: $id) {
    success
    error
  }
}

mutation AlbumDetailSetTrackWanted($albumId: String!, $wanted: Boolean!) {
  updateTracks(
    where: { albumId: { eq: $albumId } }
    input: { wanted: $wanted }
  ) {
    success
    error
    affectedCount
  }
}

query AudiobookDetailRoute($id: String!) {
  audiobook(id: $id) {
    id
    libraryId
    title
    sortTitle
    isbn
    description
    publisher
    language
    narrators
    totalDurationSecs
    coverUrl
    hasFiles
    sizeBytes
    path
    chapters(page: { limit: 5000, offset: 0 }) {
      edges {
        node {
          id
          audiobookId
          chapterNumber
          title
          startTimeSecs
          endTimeSecs
          durationSecs
          mediaFileId
          wanted
        }
      }
    }
  }
}

mutation DeleteAudiobookRoute($id: String!) {
  deleteAudiobook(id: $id) {
    success
    error
  }
}

mutation AudiobookDetailSetChapterWanted(
  $audiobookId: String!
  $wanted: Boolean!
) {
  updateChapters(
    where: { audiobookId: { eq: $audiobookId } }
    input: { wanted: $wanted }
  ) {
    success
    error
    affectedCount
  }
}

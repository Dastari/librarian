query BrowseDirectory($input: BrowseDirectoryInput) {
  browseDirectory(input: $input) {
    currentPath
    parentPath
    entries {
      name
      path
      isDir
      size
      sizeFormatted
      readable
      writable
      mimeType
      modifiedAt
    }
    quickPaths {
      name
      path
    }
    isLibraryPath
    libraryId
  }
}

query FilesystemRuntimeInfo {
  filesystemRuntimeInfo {
    platform
    supportsUncCredentials
    supportsSambaMount
    defaultLinuxMountBase
  }
}

query LibraryPathAvailability($input: LibraryPathAvailabilityInput!) {
  libraryPathAvailability(input: $input) {
    path
    reachable
    exists
    isDirectory
    needsReconnect
    reconnectAttempted
    reconnectSucceeded
    message
  }
}

mutation ConfigureNetworkPath($input: ConfigureNetworkPathInput!) {
  configureNetworkPath(input: $input) {
    success
    error
    resolvedPath
    connected
    stored
    message
  }
}

mutation ReconnectLibraryPath($path: String!) {
  reconnectLibraryPath(path: $path) {
    success
    error
    resolvedPath
    connected
    stored
    message
  }
}

mutation CreateDirectory($input: CreateDirectoryInput!) {
  createDirectory(input: $input) {
    success
    error
    affectedCount
    messages
    path
  }
}

mutation DeleteFiles($input: DeleteFilesInput!) {
  deleteFiles(input: $input) {
    success
    error
    affectedCount
    messages
    path
  }
}

mutation CopyFiles($input: CopyFilesInput!) {
  copyFiles(input: $input) {
    success
    error
    affectedCount
    messages
    path
  }
}

mutation MoveFiles($input: MoveFilesInput!) {
  moveFiles(input: $input) {
    success
    error
    affectedCount
    messages
    path
  }
}

mutation RenameFile($input: RenameFileInput!) {
  renameFile(input: $input) {
    success
    error
    affectedCount
    messages
    path
  }
}

query PlaybackSessions(
  $Where: PlaybackSessionWhereInput
  $OrderBy: [PlaybackSessionOrderByInput!]
  $Page: PageInput
) {
  PlaybackSessions: playbackSessions(
    where: $Where
    orderBy: $OrderBy
    page: $Page
  ) {
    Edges: edges {
      Node: node {
        Id
        UserId
        MediaFileId
        CurrentPosition
        Duration
        Volume
        IsMuted
        IsPlaying
        StartedAt
        LastUpdatedAt
        CompletedAt
        CreatedAt
        UpdatedAt
      }
      Cursor: cursor
    }
    PageInfo: pageInfo {
      HasNextPage: hasNextPage
      TotalCount: totalCount
    }
  }
}

query ShowPlaybackProgressByMedia(
  $Where: PlaybackProgressWhereInput
  $Page: PageInput
  $OrderBy: [PlaybackProgressOrderByInput!]
) {
  PlaybackProgresses: playbackProgresses(
    where: $Where
    page: $Page
    orderBy: $OrderBy
  ) {
    Edges: edges {
      Node: node {
        Id
        MediaFileId
        CurrentPosition
        Duration
        ProgressPercent
        IsWatched
        UpdatedAt
      }
    }
  }
}


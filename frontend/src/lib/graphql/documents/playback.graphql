mutation CreatePlaybackSessionContext($input: CreatePlaybackSessionInput!) {
  createPlaybackSession(input: $input) {
    success
    error
    playbackSession {
      id
      userId
      contentType
      mediaFileId
      episodeId
      movieId
      trackId
      audiobookId
      tvShowId
      albumId
      currentPosition
      duration
      volume
      isMuted
      isPlaying
      startedAt
      lastUpdatedAt
      completedAt
      createdAt
      updatedAt
    }
  }
}


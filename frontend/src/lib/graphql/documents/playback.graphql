query PlaybackSessions(
  $where: PlaybackSessionWhereInput
  $orderBy: [PlaybackSessionOrderByInput!]
  $page: PageInput
) {
  playbackSessions(
    where: $where
    orderBy: $orderBy
    page: $page
  ) {
    edges {
      node {
        id
        userId
        mediaFileId
        currentPosition
        duration
        volume
        isMuted
        isPlaying
        startedAt
        lastUpdatedAt
        completedAt
        createdAt
        updatedAt
      }
      cursor
    }
    pageInfo {
      hasNextPage
      totalCount
    }
  }
}

query ShowPlaybackProgressByMedia(
  $where: PlaybackProgressWhereInput
  $page: PageInput
  $orderBy: [PlaybackProgressOrderByInput!]
) {
  playbackProgresses(
    where: $where
    page: $page
    orderBy: $orderBy
  ) {
    edges {
      node {
        id
        mediaFileId
        currentPosition
        duration
        progressPercent
        isWatched
        updatedAt
      }
    }
  }
}


mutation CreatePlaybackSessionContext($Input: CreatePlaybackSessionInput!) {
  CreatePlaybackSession: createPlaybackSession(input: $Input) {
    Success: success
    Error: error
    PlaybackSession: playbackSession {
      Id
      UserId
      ContentType
      MediaFileId
      EpisodeId
      MovieId
      TrackId
      AudiobookId
      TvShowId
      AlbumId
      CurrentPosition
      Duration
      Volume
      IsMuted
      IsPlaying
      StartedAt
      LastUpdatedAt
      CompletedAt
      CreatedAt
      UpdatedAt
    }
  }
}

mutation UpdatePlaybackSessionContext(

query PlaybackSessions(
  $Where: PlaybackSessionWhereInput
  $OrderBy: [PlaybackSessionOrderByInput!]
  $Page: PageInput
) {
  PlaybackSessions(Where: $Where, OrderBy: $OrderBy, Page: $Page) {
    Edges {
      Node {
        Id
        UserId
        MediaFileId
        CurrentPosition
        Duration
        Volume
        IsMuted
        IsPlaying
        StartedAt
        LastUpdatedAt
        CompletedAt
        CreatedAt
        UpdatedAt
      }
      Cursor
    }
    PageInfo {
      HasNextPage
      TotalCount
    }
  }
}

query ShowPlaybackProgressByMedia(
  $Where: PlaybackProgressWhereInput
  $Page: PageInput
  $OrderBy: [PlaybackProgressOrderByInput!]
) {
  PlaybackProgresses(Where: $Where, Page: $Page, OrderBy: $OrderBy) {
    Edges {
      Node {
        Id
        MediaFileId
        CurrentPosition
        Duration
        ProgressPercent
        IsWatched
        UpdatedAt
      }
    }
  }
}


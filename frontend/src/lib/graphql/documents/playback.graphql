mutation CreatePlaybackSessionContext($Input: CreatePlaybackSessionInput!) {
  CreatePlaybackSession(Input: $Input) {
    Success
    Error
    PlaybackSession {
      Id
      UserId
      ContentType
      MediaFileId
      EpisodeId
      MovieId
      TrackId
      AudiobookId
      TvShowId
      AlbumId
      CurrentPosition
      Duration
      Volume
      IsMuted
      IsPlaying
      StartedAt
      LastUpdatedAt
      CompletedAt
      CreatedAt
      UpdatedAt
    }
  }
}


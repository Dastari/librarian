query SearchMovies($query: String!, $year: Int) {
  searchMovies(query: $query, year: $year) {
    provider
    providerId
    title
    originalTitle
    year
    overview
    posterUrl
    backdropUrl
    imdbId
    voteAverage
    popularity
  }
}

query SearchMovieCollections($query: String!) {
  searchMovieCollections(query: $query) {
    provider
    collectionId
    name
    overview
    posterUrl
    backdropUrl
  }
}

mutation AddMovie($libraryId: String!, $input: AddMovieInput!) {
  addMovie(libraryId: $libraryId, input: $input) {
    success
    movie {
      id
      libraryId
      title
      year
      tmdbId
      imdbId
      overview
      monitored
      mediaFileId
    }
    error
  }
}

mutation AddMovieCollection(
  $libraryId: String!
  $input: AddMovieCollectionInput!
) {
  addMovieCollection(libraryId: $libraryId, input: $input) {
    success
    collectionId
    collectionName
    importedCount
    existingCount
    wantedUpdatedCount
    error
  }
}

subscription MovieChanged($filter: SubscriptionFilterInput) {
  movieChanged(filter: $filter) {
    action
    id
    movie {
      libraryId
    }
  }
}

query MovieDetailRoute($id: String!) {
  movie(id: $id) {
    id
    libraryId
    title
    sortTitle
    originalTitle
    year
    tmdbId
    imdbId
    overview
    tagline
    runtime
    genres
    director
    castNames
    monitored
    mediaFileId
    collectionId
    collectionName
    collectionPosterUrl
    posterUrl: collectionPosterUrl
    tmdbRating
    tmdbVoteCount
    certification
    releaseDate
    productionCountries
    spokenLanguages
    wanted
    mediaFile {
      id
      size
      duration
    }
  }
}

mutation MovieDetailSetWanted($id: String!, $wanted: Boolean!) {
  updateMovie(id: $id, input: { wanted: $wanted }) {
    success
    error
    movie {
      id
      wanted
    }
  }
}

mutation RefreshMovieRoute($id: String!) {
  refreshMovie(id: $id) {
    success
    error
    movie {
      id
      title
      overview
      tagline
      tmdbRating
      tmdbVoteCount
    }
  }
}

mutation DeleteMovieModal($id: String!) {
  deleteMovie(id: $id) {
    success
    error
  }
}

query MovieCollectionPeersRoute($libraryId: String!, $collectionId: Int!) {
  movieCollectionDetails(libraryId: $libraryId, collectionId: $collectionId) {
    movies {
      tmdbId
      title
      year
      posterUrl
      libraryMovieId
      mediaFileId
      fileSizeBytes
      resolution
      videoCodec
      audioCodec
      audioChannels
      wanted
    }
  }
}

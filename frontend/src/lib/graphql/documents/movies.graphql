query SearchMovies($Query: String!, $Year: Int) {
  SearchMovies(Query: $Query, Year: $Year) {
    Provider
    ProviderId
    Title
    OriginalTitle
    Year
    Overview
    PosterUrl
    BackdropUrl
    ImdbId
    VoteAverage
    Popularity
  }
}

query SearchMovieCollections($Query: String!) {
  SearchMovieCollections(Query: $Query) {
    Provider
    CollectionId
    Name
    Overview
    PosterUrl
    BackdropUrl
  }
}

mutation AddMovie($LibraryId: String!, $Input: AddMovieInput!) {
  AddMovie(LibraryId: $LibraryId, Input: $Input) {
    Success
    Movie {
      Id
      LibraryId
      Title
      Year
      TmdbId
      ImdbId
      Overview
      Monitored
      MediaFileId
    }
    Error
  }
}

mutation AddMovieCollection(
  $LibraryId: String!
  $Input: AddMovieCollectionInput!
) {
  AddMovieCollection(LibraryId: $LibraryId, Input: $Input) {
    Success
    CollectionId
    CollectionName
    ImportedCount
    ExistingCount
    WantedUpdatedCount
    Error
  }
}

subscription MovieChanged($Filter: SubscriptionFilterInput) {
  MovieChanged: movieChanged(filter: $Filter) {
    Action: action
    Id: id
    Movie: movie {
      LibraryId
    }
  }
}

query MovieDetailRoute($Id: String!) {
  Movie: movie(id: $Id) {
    Id
    LibraryId
    Title
    SortTitle
    OriginalTitle
    Year
    TmdbId
    ImdbId
    Overview
    Tagline
    Runtime
    Genres
    Director
    CastNames
    Monitored
    MediaFileId
    CollectionId
    CollectionName
    CollectionPosterUrl
    PosterUrl: CollectionPosterUrl
    TmdbRating
    TmdbVoteCount
    Certification
    ReleaseDate
    ProductionCountries
    SpokenLanguages
    Wanted
    MediaFile: mediaFile {
      Id
      Size
      Duration
    }
  }
}

mutation MovieDetailSetWanted($Id: String!, $Wanted: Boolean!) {
  UpdateMovie: updateMovie(id: $Id, input: { Wanted: $Wanted }) {
    Success: success
    Error: error
    Movie: movie {
      Id
      Wanted
    }
  }
}

mutation RefreshMovieRoute($Id: String!) {
  RefreshMovie(Id: $Id) {
    Success
    Error
    Movie {
      Id
      Title
      Overview
      Tagline
      TmdbRating
      TmdbVoteCount
    }
  }
}

mutation DeleteMovieModal($Id: String!) {
  DeleteMovie: deleteMovie(id: $Id) {
    Success: success
    Error: error
  }
}

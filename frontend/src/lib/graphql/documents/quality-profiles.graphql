query QualityProfiles($page: PageInput) {
  qualityProfiles(orderBy: [{ name: ASC }], page: $page) {
    edges {
      node {
        id
        name
        mediaKind
        allowedResolutions
        allowedVideoCodecs
        allowedAudioFormats
        allowedHdrTypes
        allowedSources
        releaseGroupBlacklist
        releaseGroupWhitelist
        requireHdr
        cutoffResolution
        upgradeUntilCutoff
        isDefault
        createdAt
        updatedAt
      }
    }
    pageInfo {
      totalCount
    }
  }
}

mutation CreateQualityProfile($input: CreateQualityProfileInput!) {
  createQualityProfile(input: $input) {
    success
    error
    qualityProfile {
      id
      name
      mediaKind
      allowedResolutions
      allowedVideoCodecs
      allowedAudioFormats
      allowedHdrTypes
      allowedSources
      releaseGroupBlacklist
      releaseGroupWhitelist
      requireHdr
      cutoffResolution
      upgradeUntilCutoff
      isDefault
      createdAt
      updatedAt
    }
  }
}

mutation UpdateQualityProfile($id: String!, $input: UpdateQualityProfileInput!) {
  updateQualityProfile(id: $id, input: $input) {
    success
    error
    qualityProfile {
      id
      name
      mediaKind
      allowedResolutions
      allowedVideoCodecs
      allowedAudioFormats
      allowedHdrTypes
      allowedSources
      releaseGroupBlacklist
      releaseGroupWhitelist
      requireHdr
      cutoffResolution
      upgradeUntilCutoff
      isDefault
      createdAt
      updatedAt
    }
  }
}

mutation DeleteQualityProfile($id: String!) {
  deleteQualityProfile(id: $id) {
    success
    error
  }
}

mutation ApproveQualityUpgrade($notificationId: String!) {
  approveQualityUpgrade(notificationId: $notificationId) {
    success
    error
  }
}

query MediaFileProperties($id: String!) {
  mediaFile(id: $id) {
    id
    libraryId
    path
    relativePath
    originalName
    size
    container
    videoCodec
    audioCodec
    resolution
    isHdr
    hdrType
    width
    height
    duration
    bitrate
    audioChannels
    episodeId
    movieId
    trackId
    contentType
    addedAt
  }
  videoStreams(
    where: { mediaFileId: { eq: $id } }
    orderBy: [{ streamIndex: ASC }]
    page: { limit: 200, offset: 0 }
  ) {
    edges {
      node {
        id
        streamIndex
        codec
        codecLongName
        width
        height
        aspectRatio
        frameRate
        bitrate
        pixelFormat
        hdrType
        bitDepth
        language
        title
        isDefault
      }
    }
  }
  audioStreams(
    where: { mediaFileId: { eq: $id } }
    orderBy: [{ streamIndex: ASC }]
    page: { limit: 200, offset: 0 }
  ) {
    edges {
      node {
        id
        streamIndex
        codec
        codecLongName
        channels
        channelLayout
        sampleRate
        bitrate
        bitDepth
        language
        title
        isDefault
        isCommentary
      }
    }
  }
  subtitles(
    where: { mediaFileId: { eq: $id } }
    orderBy: [{ createdAt: ASC }]
    page: { limit: 200, offset: 0 }
  ) {
    edges {
      node {
        id
        streamIndex
        sourceType
        codec
        codecLongName
        language
        title
        isDefault
        isForced
        isHearingImpaired
        filePath
      }
    }
  }
  mediaChapters(
    where: { mediaFileId: { eq: $id } }
    orderBy: [{ chapterIndex: ASC }]
    page: { limit: 500, offset: 0 }
  ) {
    edges {
      node {
        id
        chapterIndex
        startSecs
        endSecs
        title
      }
    }
  }
}

query MediaFileByPathLookup($path: String!) {
  mediaFiles(
    where: { path: { eq: $path } }
    page: { limit: 1, offset: 0 }
  ) {
    edges {
      node {
        id
        path
      }
    }
  }
}

query MediaFileMetadata($id: String!) {
  mediaFile(id: $id) {
    id
    metadata
  }
}

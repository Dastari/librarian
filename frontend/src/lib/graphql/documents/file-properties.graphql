query MediaFileProperties($Id: String!) {
  MediaFile: mediaFile(id: $Id) {
    Id
    LibraryId
    Path
    RelativePath
    OriginalName
    Size
    Container
    VideoCodec
    AudioCodec
    Resolution
    IsHdr
    HdrType
    Width
    Height
    Duration
    Bitrate
    AudioChannels
    EpisodeId
    MovieId
    TrackId
    ContentType
    AddedAt
  }
  VideoStreams: videoStreams(
    where: { MediaFileId: { eq: $Id } }
    orderBy: [{ StreamIndex: ASC }]
    page: { limit: 200, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        StreamIndex
        Codec
        CodecLongName
        Width
        Height
        AspectRatio
        FrameRate
        Bitrate
        PixelFormat
        HdrType
        BitDepth
        Language
        Title
        IsDefault
      }
    }
  }
  AudioStreams: audioStreams(
    where: { MediaFileId: { eq: $Id } }
    orderBy: [{ StreamIndex: ASC }]
    page: { limit: 200, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        StreamIndex
        Codec
        CodecLongName
        Channels
        ChannelLayout
        SampleRate
        Bitrate
        BitDepth
        Language
        Title
        IsDefault
        IsCommentary
      }
    }
  }
  Subtitles: subtitles(
    where: { MediaFileId: { eq: $Id } }
    orderBy: [{ CreatedAt: ASC }]
    page: { limit: 200, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        StreamIndex
        SourceType
        Codec
        CodecLongName
        Language
        Title
        IsDefault
        IsForced
        IsHearingImpaired
        FilePath
      }
    }
  }
  MediaChapters: mediaChapters(
    where: { MediaFileId: { eq: $Id } }
    orderBy: [{ ChapterIndex: ASC }]
    page: { limit: 500, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        ChapterIndex
        StartSecs
        EndSecs
        Title
      }
    }
  }
}

query MediaFileByPathLookup($Path: String!) {
  MediaFiles: mediaFiles(
    where: { Path: { eq: $Path } }
    page: { limit: 1, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        Path
      }
    }
  }
}

query MediaFileMetadata($Id: String!) {
  MediaFile: mediaFile(id: $Id) {
    Id
    Metadata
  }
}

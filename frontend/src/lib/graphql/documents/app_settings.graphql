query PlaybackSyncInterval($key: String!) {
  appSettings(
    where: { key: { eq: $key } }
    page: { limit: 1, offset: 0 }
  ) {
    edges {
      node {
        id
        key
        value
      }
    }
  }
}

query TorrentAppSettings {
  appSettings(
    where: { category: { eq: "torrent" } }
    page: { limit: 20, offset: 0 }
  ) {
    edges {
      node {
        id
        key
        value
      }
    }
  }
}

query MetadataAppSettings {
  appSettings(
    where: { category: { eq: "metadata" } }
    page: { limit: 50, offset: 0 }
  ) {
    edges {
      node {
        id
        key
        value
      }
    }
  }
}

mutation TestTmdbConnection($input: TestTmdbConnectionInput!) {
  testTmdbConnection(input: $input) {
    success
    message
    correlationId
  }
}

query LlmAppSettings {
  appSettings(
    where: { category: { eq: "llm" } }
    page: { limit: 100, offset: 0 }
  ) {
    edges {
      node {
        id
        key
        value
      }
    }
  }
}

mutation CreateAppSetting($input: CreateAppSettingInput!) {
  createAppSetting(input: $input) {
    success
    error
    appSetting {
      id
      key
      value
    }
  }
}

mutation UpdateAppSetting($id: String!, $input: UpdateAppSettingInput!) {
  updateAppSetting(id: $id, input: $input) {
    success
    error
    appSetting {
      id
      key
      value
    }
  }
}

mutation TestOllamaConnection($input: TestOllamaConnectionInput!) {
  testOllamaConnection(input: $input) {
    success
    models
    error
  }
}

mutation TestLlmParser($input: TestLlmParserInput!) {
  testLlmParser(input: $input) {
    success
    regexResult
    error
    llmResult {
      title
      year
      showTitle
      season
      episode
      artist
      album
      track
      author
      book
      chapter
      confidence
      matchSource
    }
  }
}

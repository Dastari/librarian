mutation CreateAppSetting($Input: CreateAppSettingInput!) {
  CreateAppSetting: createAppSetting(input: $Input) {
    Success: success
    Error: error
    AppSetting: appSetting {
      Id
      Key
      Value
    }
  }
}

mutation UpdateAppSetting($Id: String!, $Input: UpdateAppSettingInput!) {
  UpdateAppSetting: updateAppSetting(id: $Id, input: $Input) {
    Success: success
    Error: error
    AppSetting: appSetting {
      Id
      Key
      Value
    }
  }
}

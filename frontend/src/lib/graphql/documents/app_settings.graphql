query PlaybackSyncInterval($Key: String!) {
  AppSettings: appSettings(
    where: { Key: { eq: $Key } }
    page: { limit: 1, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        Key
        Value
      }
    }
  }
}


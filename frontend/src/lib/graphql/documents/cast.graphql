# Cast: devices, sessions, settings (connection-based)
# Used by codegen for TypedDocumentNode and types

query CastDevices(
  $Where: CastDeviceWhereInput
  $OrderBy: [CastDeviceOrderByInput!]
  $Page: PageInput
) {
  CastDevices(Where: $Where, OrderBy: $OrderBy, Page: $Page) {
    Edges {
      Node {
        Id
        Name
        Address
        Port
        Model
        DeviceType
        IsFavorite
        IsManual
        LastSeenAt
      }
      Cursor
    }
    PageInfo {
      HasNextPage
      TotalCount
    }
  }
}

query CastSessions(
  $Where: CastSessionWhereInput
  $OrderBy: [CastSessionOrderByInput!]
  $Page: PageInput
) {
  CastSessions(Where: $Where, OrderBy: $OrderBy, Page: $Page) {
    Edges {
      Node {
        Id
        DeviceId
        MediaFileId
        EpisodeId
        StreamUrl
        PlayerState
        CurrentPosition
        Duration
        Volume
        IsMuted
        StartedAt
      }
      Cursor
    }
    PageInfo {
      HasNextPage
      TotalCount
    }
  }
}

query CastSettings(
  $Where: CastSettingWhereInput
  $OrderBy: [CastSettingOrderByInput!]
  $Page: PageInput
) {
  CastSettings(Where: $Where, OrderBy: $OrderBy, Page: $Page) {
    Edges {
      Node {
        Id
        AutoDiscoveryEnabled
        DiscoveryIntervalSeconds
        DefaultVolume
        TranscodeIncompatible
        PreferredQuality
      }
      Cursor
    }
    PageInfo {
      HasNextPage
      TotalCount
    }
  }
}

mutation CreateCastDevice($Input: CreateCastDeviceInput!) {
  CreateCastDevice(Input: $Input) {
    Success
    Error
    CastDevice {
      Id
      Name
      Address
      Port
      Model
      DeviceType
      IsFavorite
      IsManual
      LastSeenAt
    }
  }
}

mutation UpdateCastDevice($Id: String!, $Input: UpdateCastDeviceInput!) {
  UpdateCastDevice(Id: $Id, Input: $Input) {
    Success
    Error
    CastDevice {
      Id
      Name
      Address
      Port
      Model
      DeviceType
      IsFavorite
      IsManual
      LastSeenAt
    }
  }
}

mutation DeleteCastDevice($Id: String!) {
  DeleteCastDevice(Id: $Id) {
    Success
    Error
  }
}

mutation CreateCastSetting($Input: CreateCastSettingInput!) {
  CreateCastSetting(Input: $Input) {
    Success
    Error
    CastSetting {
      Id
      AutoDiscoveryEnabled
      DiscoveryIntervalSeconds
      DefaultVolume
      TranscodeIncompatible
      PreferredQuality
    }
  }
}

mutation UpdateCastSetting($Id: String!, $Input: UpdateCastSettingInput!) {

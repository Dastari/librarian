mutation CreateCastDevice($input: CreateCastDeviceInput!) {
  createCastDevice(input: $input) {
    success
    error
    castDevice {
      id
      name
      address
      port
      model
      deviceType
      isFavorite
      isManual
      lastSeenAt
    }
  }
}

mutation UpdateCastDevice($id: String!, $input: UpdateCastDeviceInput!) {
  updateCastDevice(id: $id, input: $input) {
    success
    error
    castDevice {
      id
      name
      address
      port
      model
      deviceType
      isFavorite
      isManual
      lastSeenAt
    }
  }
}

mutation DeleteCastDevice($id: String!) {
  deleteCastDevice(id: $id) {
    success
    error
  }
}


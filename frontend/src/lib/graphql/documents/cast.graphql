mutation DiscoverCastDevicesOp {
  DiscoverCastDevices {
    id
    name
    address
    port
    model
    deviceType
    isFavorite
    isManual
    isConnected
    lastSeenAt
  }
}

mutation CastMediaOp($input: CastMediaInput!) {
  CastMedia(input: $input) {
    success
    session {
      id
      deviceId
      deviceName
      mediaFileId
      episodeId
      streamUrl
      playerState
      currentTime
      duration
      volume
      isMuted
      startedAt
    }
    error
  }
}

mutation CastPlayOp($sessionId: String!) {
  CastPlay(sessionId: $sessionId) {
    success
    session {
      id
      playerState
      currentTime
    }
    error
  }
}

mutation CastPauseOp($sessionId: String!) {

mutation CreateCastDevice($Input: CreateCastDeviceInput!) {
  CreateCastDevice: createCastDevice(input: $Input) {
    Success: success
    Error: error
    CastDevice: castDevice {
      Id
      Name
      Address
      Port
      Model
      DeviceType
      IsFavorite
      IsManual
      LastSeenAt
    }
  }
}

mutation UpdateCastDevice($Id: String!, $Input: UpdateCastDeviceInput!) {
  UpdateCastDevice: updateCastDevice(id: $Id, input: $Input) {
    Success: success
    Error: error
    CastDevice: castDevice {
      Id
      Name
      Address
      Port
      Model
      DeviceType
      IsFavorite
      IsManual
      LastSeenAt
    }
  }
}

mutation DeleteCastDevice($Id: String!) {
  DeleteCastDevice: deleteCastDevice(id: $Id) {
    Success: success
    Error: error
  }
}


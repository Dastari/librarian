query CastDevices(
  $Where: CastDeviceWhereInput
  $OrderBy: [CastDeviceOrderByInput!]
  $Page: PageInput
) {
  CastDevices: castDevices(where: $Where, orderBy: $OrderBy, page: $Page) {
    Edges: edges {
      Node: node {
        Id
        Name
        Address
        Port
        Model
        DeviceType
        IsFavorite
        IsManual
        LastSeenAt
      }
      Cursor: cursor
    }
    PageInfo: pageInfo {
      HasNextPage: hasNextPage
      TotalCount: totalCount
    }
  }
}


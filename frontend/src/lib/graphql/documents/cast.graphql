mutation DiscoverCastDevicesOp {
  discoverCastDevices {
    id
    name
    address
    port
    model
    deviceType
    isFavorite
    isManual
      isConnected
      enabled
      playbackSupported
      discoveryOrigin
      lastSeenAt
  }
}

mutation CastMediaOp($input: CastMediaInput!) {

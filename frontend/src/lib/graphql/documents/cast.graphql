query CastDevices(
  $where: CastDeviceWhereInput
  $orderBy: [CastDeviceOrderByInput!]
  $page: PageInput
) {
  castDevices(where: $where, orderBy: $orderBy, page: $page) {
    edges {
      node {
        id
        name
        address
        port
        model
        deviceType
        isFavorite
        isManual
        enabled
        playbackSupported
        discoveryOrigin
        lastSeenAt
      }
      cursor
    }
    pageInfo {
      hasNextPage
      totalCount
    }
  }
}

query CastSessions(
  $where: CastSessionWhereInput

query DashboardShows(
  $where: ShowWhereInput
  $page: PageInput
  $orderBy: [ShowOrderByInput!]
) {
  shows(where: $where, page: $page, orderBy: $orderBy) {
    edges {
      node {
        id
        libraryId
        name
        sortName
        year
        tvmazeId
        tmdbId
        tvdbId
        imdbId
        overview
        network
        runtime
        posterUrl
        backdropUrl
        path
        genres
        createdAt
      }
      cursor
    }
    pageInfo {
      totalCount
    }
  }
}

query DashboardScheduleCaches(
  $where: ScheduleCacheWhereInput
  $orderBy: [ScheduleCacheOrderByInput!]
  $page: PageInput
) {
  scheduleCaches(
    where: $where
    orderBy: $orderBy
    page: $page
  ) {
    edges {
      node {
        id
        tvmazeEpisodeId
        episodeName
        season
        episodeNumber
        episodeType
        airDate
        airTime
        airStamp
        runtime
        episodeImageUrl
        summary
        tvmazeShowId
        showName
        showNetwork
        showPosterUrl
        showGenres
        countryCode
      }
      cursor
    }
    pageInfo {
      totalCount
    }
  }
}

query DashboardRecentMedia {
  shows(orderBy: [{createdAt: DESC}], page: {limit: 6}) {
    edges { node { id name posterUrl createdAt } }
  }
  movies(orderBy: [{createdAt: DESC}], page: {limit: 6}) {
    edges { node { id title collectionPosterUrl createdAt } }
  }
  albums(orderBy: [{createdAt: DESC}], page: {limit: 6}) {
    edges { node { id name coverUrl createdAt } }
  }
  audiobooks(orderBy: [{createdAt: DESC}], page: {limit: 6}) {
    edges { node { id title coverUrl createdAt } }
  }
}

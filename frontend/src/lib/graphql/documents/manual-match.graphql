query ManualMatchShowsByLibrary($LibraryId: String!) {
  Shows: shows(where: { LibraryId: { eq: $LibraryId } }) {
    Edges: edges {
      Node: node {
        Id
        Name
        Year
        Episodes: episodes {
          Edges: edges {
            Node: node {
              Id
              Season
              Episode
              Title
            }
          }
        }
      }
    }
  }
}

query ManualMatchMoviesByLibrary($LibraryId: String!) {
  Movies: movies(where: { LibraryId: { eq: $LibraryId } }) {
    Edges: edges {
      Node: node {
        Id
        Title
        Year
      }
    }
  }
}

query ManualMatchAlbumsByLibrary($LibraryId: String!) {
  Albums: albums(
    where: { LibraryId: { eq: $LibraryId } }
    page: { limit: 500, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        Name
        Year
      }
    }
  }
  Tracks: tracks(
    where: { LibraryId: { eq: $LibraryId } }
    page: { limit: 5000, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        AlbumId
        ArtistName
        TrackNumber
        Title
      }
    }
  }
}

query ManualMatchAudiobooksByLibrary($LibraryId: String!) {
  Audiobooks: audiobooks(
    where: { LibraryId: { eq: $LibraryId } }
    page: { limit: 500, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        Title
        AuthorName
        Chapters: chapters {
          Edges: edges {
            Node: node {
              Id
              ChapterNumber
              Title
            }
          }
        }
      }
    }
  }
}

mutation ManualMatchFile($Input: MatchMediaFileInput!) {
  MatchMediaFile(Input: $Input) {
    Success
    Confidence
    MatchedId
    MatchedType
    Reason
  }
}

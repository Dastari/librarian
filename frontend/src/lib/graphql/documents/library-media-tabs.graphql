query LibraryAlbumsTab($LibraryId: String!) {
  Albums: albums(
    where: { LibraryId: { eq: $LibraryId } }
    page: { limit: 5000, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        ArtistId
        LibraryId
        Name
        SortName
        Year
        MusicbrainzId
        AlbumType
        Genres
        Label
        Country
        ReleaseDate
        CoverUrl
        TrackCount
        DiscCount
        TotalDurationSecs
        HasFiles
        SizeBytes
        Path
      }
    }
  }
}

query LibraryArtistsTab($LibraryId: String!) {
  Artists: artists(
    where: { LibraryId: { eq: $LibraryId } }
    page: { limit: 5000, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        LibraryId
        Name
        SortName
        MusicbrainzId
      }
    }
  }
}

query LibraryAudiobooksTab($LibraryId: String!) {
  Audiobooks: audiobooks(
    where: { LibraryId: { eq: $LibraryId } }
    page: { limit: 5000, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        LibraryId
        Title
        SortTitle
        Isbn
        Description
        Publisher
        Language
        Narrators
        CoverUrl
        HasFiles
        SizeBytes
        Path
        ChapterCount
        TotalDurationSecs
        AuthorName
      }
    }
  }
}

query LibraryUnmatchedMediaFilesTab($LibraryId: String!) {
  MediaFiles: mediaFiles(
    where: {
      LibraryId: { eq: $LibraryId }
      EpisodeId: { isNull: true }
      MovieId: { isNull: true }
      TrackId: { isNull: true }
      ChapterId: { isNull: true }
    }
    orderBy: [{ AddedAt: DESC }]
    page: { limit: 2000, offset: 0 }
  ) {
    Edges: edges {
      Node: node {
        Id
        LibraryId
        Path
        RelativePath
        OriginalName
        Size
        Container
        VideoCodec
        AudioCodec
        Resolution
        IsHdr
        HdrType
        Width
        Height
        Duration
        EpisodeId
        ChapterId
        AddedAt
      }
    }
  }
}

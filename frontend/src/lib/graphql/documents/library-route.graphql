query LibraryDetailRoute($Id: String!) {
  Library: library(id: $Id) {
    Id
    Name
    Path
    LibraryType
    AutoScan
    ScanIntervalMinutes
    WatchForChanges
    AutoOrganize
    NamingPattern
    Scanning
  }
}

mutation UpdateLibraryRoute($Id: String!, $Input: UpdateLibraryInput!) {
  UpdateLibrary: updateLibrary(id: $Id, input: $Input) {
    Success: success
    Error: error
    Library: library {
      Id
    }
  }
}

mutation DeleteShowRoute($Id: String!) {
  DeleteShow: deleteShow(id: $Id) {
    Success: success
    Error: error
  }
}

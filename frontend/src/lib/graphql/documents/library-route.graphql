query LibraryDetailRoute($id: String!) {
  library(id: $id) {
    id
    name
    path
    libraryType
    autoScan
    scanIntervalMinutes
    watchForChanges
    autoOrganize
    namingPattern
    qualityProfileId
    scanning
  }
}

mutation UpdateLibraryRoute($id: String!, $input: UpdateLibraryInput!) {
  updateLibrary(id: $id, input: $input) {
    success
    error
    library {
      id
    }
  }
}

mutation DeleteShowRoute($id: String!) {
  deleteShow(id: $id) {
    success
    error
  }
}

query Notifications(
  $where: NotificationWhereInput
  $orderBy: [NotificationOrderByInput!]
  $page: PageInput
) {
  notifications(where: $where, orderBy: $orderBy, page: $page) {
    edges {
      node {
        id
        userId
        notificationType
        category
        title
        message
        libraryId
        torrentId
        mediaFileId
        pendingMatchId
        actionType
        actionData
        readAt
        resolvedAt
        resolution
        createdAt
        updatedAt
      }
      cursor
    }
    pageInfo {
      hasNextPage
      totalCount
    }
  }
}

subscription NotificationChanged($filter: SubscriptionFilterInput) {
  notificationChanged(filter: $filter) {
    action
    id
    notification {
      id
      readAt
      resolvedAt
      resolution
    }
  }
}

mutation UpdateNotification($id: String!, $input: UpdateNotificationInput!) {
  updateNotification(id: $id, input: $input) {
    success
    error
    notification {
      id
      readAt
      resolvedAt
      resolution
    }
  }
}

mutation DeleteNotification($id: String!) {
  deleteNotification(id: $id) {
    success
    error
  }
}

query UnresolvedLibraryScanIssues(
  $page: PageInput
  $where: LibraryScanIssueWhereInput = { resolvedAt: { isNull: true } }
) {
  libraryScanIssues(
    where: $where
    orderBy: [{ createdAt: DESC }]
    page: $page
  ) {
    edges {
      node {
        id
        scanRunId
        libraryId
        mediaFileId
        stage
        issueCode
        severity
        message
        remediation
        detailsJson
        occurrenceCount
        readAt
        createdAt
      }
      cursor
    }
    pageInfo {
      hasNextPage
      totalCount
    }
  }
}

subscription LibraryScanIssueNotificationChanged(
  $filter: SubscriptionFilterInput
) {
  libraryScanIssueChanged(filter: $filter) {
    action
    id
    libraryScanIssue {
      id
      resolvedAt
      readAt
    }
  }
}

mutation MarkAllNotificationsRead {
  markAllNotificationsRead {
    notificationCount
    scanIssueCount
  }
}

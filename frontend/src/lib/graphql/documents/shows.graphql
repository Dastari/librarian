query SearchTvShows($query: String!) {
  searchTvShows(query: $query) {
    provider
    providerId
    name
    year
    network
    overview
    status
    posterUrl
    tvdbId
    imdbId
    score
  }
}

mutation AddTvShow($libraryId: String!, $input: AddTvShowInput!) {
  addTvShow(libraryId: $libraryId, input: $input) {
    success
    show {
      id
      name
    }
    error
  }
}

subscription ShowChanged($filter: SubscriptionFilterInput) {
  showChanged(filter: $filter) {
    action
    id
    show {
      libraryId
    }
  }
}

query ShowDetailRoute($id: String!) {
  show(id: $id) {
    id
    libraryId
    name
    sortName
    year
    tvmazeId
    tmdbId
    tvdbId
    imdbId
    overview
    network
    posterUrl
    backdropUrl
    runtime
    genres
    autoDownload
    autoDownloadMode
    qualityProfileId
    path
    createdAt
    updatedAt
    userId
    episodes(page: { limit: 2000 }) {
      edges {
        node {
          id
          showId
          season
          episode
          absoluteNumber
          title
          overview
          airDate
          runtime
          tvmazeId
          tmdbId
          tvdbId
          mediaFileId
          wanted
          mediaFile {
            id
            size
            duration
            resolution
            videoCodec
            audioCodec
            audioChannels
            isHdr
            hdrType
          }
          createdAt
          updatedAt
        }
      }
    }
  }
}

mutation RefreshShowRoute($id: String!) {
  refreshShow(id: $id) {
    success
    show {
      id
      name
      overview
    }
    error
  }
}

mutation UpdateShowSettings($id: String!, $input: UpdateShowInput!) {
  updateShow(id: $id, input: $input) {
    success
    error
    show {
      id
      autoDownload
      autoDownloadMode
      qualityProfileId
    }
  }
}

mutation ShowDetailSetEpisodeWanted($showId: String!, $wanted: Boolean!) {
  updateEpisodes(
    where: { showId: { eq: $showId } }
    input: { wanted: $wanted }
  ) {
    success
    error
    affectedCount
  }
}

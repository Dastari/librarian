query Sources(
  $where: SourceWhereInput
  $orderBy: [SourceOrderByInput!]
  $page: PageInput
) {
  sources(where: $where, orderBy: $orderBy, page: $page) {
    edges {
      node {
        id
        name
        sourceType
        definitionId
        enabled
        priority
        mediaTypes
        siteUrl
        supportsSearch
        supportsTvSearch
        supportsMovieSearch
        supportsMusicSearch
        supportsBookSearch
        settings
        lastError
        errorCount
        lastSuccessAt
        lastErrorAt
        createdAt
        updatedAt
      }
    }
    pageInfo {
      totalCount
      hasNextPage
      hasPreviousPage
    }
  }
}

query AvailableSourceDefinitions {
  availableSourceDefinitions {
    id
    name
    description
    sourceType
    trackerType
    language
    siteLink
    requiredCredentials
  }
}

query SourceSettingDefinitions($definitionId: String!) {
  sourceSettingDefinitions(definitionId: $definitionId) {
    key
    label
    settingType
    defaultValue
    options {
      value
      label
    }
  }
}

query SearchSources($input: SearchSourcesInput!) {
  searchSources(input: $input) {
    sources {
      sourceId
      sourceName
      releases {
        title
        guid
        link
        magnetUri
        infoHash
        details
        publishDate
        categories
        size
        sizeFormatted
        seeders
        leechers
        peers
        grabs
        isFreeleech
        imdbId
        poster
        description
        sourceId
        sourceName
      }
      elapsedMs
      fromCache
      error
    }
    totalReleases
    totalElapsedMs
    sourcesSearched
  }
}

mutation CreateSource($input: CreateSourceInput!) {
  createSource(input: $input) {
    success
    error
  }
}

mutation UpdateSource($id: String!, $input: UpdateSourceInput!) {
  updateSource(id: $id, input: $input) {
    success
    error
  }
}

mutation DeleteSource($id: String!) {
  deleteSource(id: $id) {
    success
    error
  }
}

mutation TestSource($id: String!) {
  testSource(id: $id) {
    success
    error
    releasesFound
    elapsedMs
  }
}

mutation UpdateSourcePriorities($input: UpdateSourcePrioritiesInput!) {
  updateSourcePriorities(input: $input) {
    success
    error
  }
}

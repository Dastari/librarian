query Sources(
  $Where: SourceWhereInput
  $OrderBy: [SourceOrderByInput!]
  $Page: PageInput
) {
  Sources: sources(where: $Where, orderBy: $OrderBy, page: $Page) {
    Edges: edges {
      Node: node {
        Id
        Name
        SourceType
        DefinitionId
        Enabled
        Priority
        MediaTypes
        SiteUrl
        SupportsSearch
        SupportsTvSearch
        SupportsMovieSearch
        SupportsMusicSearch
        SupportsBookSearch
        Settings
        LastError
        ErrorCount
        LastSuccessAt
        LastErrorAt
        CreatedAt
        UpdatedAt
      }
    }
    PageInfo: pageInfo {
      TotalCount: totalCount
      HasNextPage: hasNextPage
      HasPreviousPage: hasPreviousPage
    }
  }
}

query AvailableSourceDefinitions {
  AvailableSourceDefinitions {
    Id
    Name
    Description
    SourceType
    TrackerType
    Language
    SiteLink
    RequiredCredentials
  }
}

query SourceSettingDefinitions($DefinitionId: String!) {
  SourceSettingDefinitions(DefinitionId: $DefinitionId) {
    Key
    Label
    SettingType
    DefaultValue
    Options {
      Value
      Label
    }
  }
}

query SearchSources($Input: SearchSourcesInput!) {
  SearchSources(Input: $Input) {
    Sources {
      SourceId
      SourceName
      Releases {
        Title
        Guid
        Link
        MagnetUri
        InfoHash
        Details
        PublishDate
        Categories
        Size
        SizeFormatted
        Seeders
        Leechers
        Peers
        Grabs
        IsFreeleech
        ImdbId
        Poster
        Description
        SourceId
        SourceName
      }
      ElapsedMs
      FromCache
      Error
    }
    TotalReleases
    TotalElapsedMs
    SourcesSearched
  }
}

mutation CreateSource($Input: CreateSourceInput!) {
  CreateSource: createSource(input: $Input) {
    Success: success
    Error: error
  }
}

mutation UpdateSource($Id: String!, $Input: UpdateSourceInput!) {
  UpdateSource: updateSource(id: $Id, input: $Input) {
    Success: success
    Error: error
  }
}

mutation DeleteSource($Id: String!) {
  DeleteSource: deleteSource(id: $Id) {
    Success: success
    Error: error
  }
}

mutation TestSource($Id: String!) {
  TestSource(Id: $Id) {
    Success
    Error
    ReleasesFound
    ElapsedMs
  }
}

mutation UpdateSourcePriorities($Input: UpdateSourcePrioritiesInput!) {
  UpdateSourcePriorities(Input: $Input) {
    Success
    Error
  }
}

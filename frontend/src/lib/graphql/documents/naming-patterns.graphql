query OrganizationNamingPatterns(
  $OrderBy: [NamingPatternOrderByInput!]
  $Page: PageInput
) {
  NamingPatterns: namingPatterns(orderBy: $OrderBy, page: $Page) {
    Edges: edges {
      Node: node {
        Id
        Name
        Pattern
        Description
        LibraryType
        IsDefault
        IsSystem
      }
    }
  }
}

mutation OrganizationCreateNamingPattern($Input: CreateNamingPatternInput!) {
  CreateNamingPattern: createNamingPattern(input: $Input) {
    Success: success
    Error: error
    NamingPattern: namingPattern {
      Id
      Name
      Pattern
      Description
      LibraryType
      IsDefault
      IsSystem
    }
  }
}

mutation OrganizationUpdateNamingPattern(
  $Id: String!
  $Input: UpdateNamingPatternInput!
) {
  UpdateNamingPattern: updateNamingPattern(id: $Id, input: $Input) {
    Success: success
    Error: error
    NamingPattern: namingPattern {
      Id
      Name
      Pattern
      Description
      LibraryType
      IsDefault
      IsSystem
    }
  }
}

mutation OrganizationDeleteNamingPattern($Id: String!) {
  DeleteNamingPattern: deleteNamingPattern(id: $Id) {
    Success: success
    Error: error
  }
}

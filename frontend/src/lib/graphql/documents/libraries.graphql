# Libraries: query, subscription, create and delete
# Used by codegen for TypedDocumentNode and types

query Libraries(
  $Where: LibraryWhereInput
  $OrderBy: [LibraryOrderByInput!]
  $Page: PageInput
) {
  Libraries(Where: $Where, OrderBy: $OrderBy, Page: $Page) {
    Edges {
      Node {
        Id
        UserId
        Name
        Path
        LibraryType
        Icon
        Color
        AutoScan
        ScanIntervalMinutes
        WatchForChanges
        AutoOrganize
        NamingPattern
        Scanning
        LastScannedAt
        CreatedAt
        UpdatedAt
        Shows {
          PageInfo {
            TotalCount
          }
        }
        ShowArtwork: Shows(
          OrderBy: { UpdatedAt: Desc }
          Page: { Limit: 8, Offset: 0 }
        ) {
          Edges {
            Node {
              Id
              PosterUrl
            }
          }
        }
        Movies {
          PageInfo {
            TotalCount
          }
        }
        MovieArtwork: Movies(
          OrderBy: { UpdatedAt: Desc }
          Page: { Limit: 8, Offset: 0 }
        ) {
          Edges {
            Node {
              Id
              PosterUrl
            }
          }
        }
        Albums {
          PageInfo {
            TotalCount
          }
        }
        AlbumArtwork: Albums(
          OrderBy: { UpdatedAt: Desc }
          Page: { Limit: 8, Offset: 0 }
        ) {
          Edges {
            Node {
              Id
              CoverUrl
            }
          }
        }
        Audiobooks {
          PageInfo {
            TotalCount
          }
        }
        AudiobookArtwork: Audiobooks(
          OrderBy: { UpdatedAt: Desc }
          Page: { Limit: 8, Offset: 0 }
        ) {
          Edges {
            Node {
              Id
              CoverUrl
            }
          }
        }
      }
      Cursor
    }
    PageInfo {
      HasNextPage
      TotalCount
    }
  }
}

subscription LibraryChanged($Filter: SubscriptionFilterInput) {
  LibraryChanged(Filter: $Filter) {
    Action
    Id
    Library {
      Id
      Name
      Path
      LibraryType
      Icon
      Color
      AutoScan
      ScanIntervalMinutes
      WatchForChanges
      Scanning
      LastScannedAt
      CreatedAt
      UpdatedAt
    }
  }
}

mutation CreateLibrary($Input: CreateLibraryInput!) {
  CreateLibrary(Input: $Input) {
    Success
    Error
    Library {
      Id
      Name
      Path
      LibraryType
      Icon
      Color
    }
  }
}

mutation DeleteLibrary($Id: String!) {
  DeleteLibrary(Id: $Id) {
    Success
    Error
  }
}

mutation ScanLibrary($Id: String!) {
  ScanLibrary(Id: $Id) {
    Success
    Status
    Message
  }
}

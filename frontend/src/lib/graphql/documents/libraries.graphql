query Libraries(
  $where: LibraryWhereInput
  $orderBy: [LibraryOrderByInput!]
  $page: PageInput
) {
  libraries(where: $where, orderBy: $orderBy, page: $page) {
    edges {
      node {
        id
        userId
        name
        path
        libraryType
        icon
        color
        autoScan
        scanIntervalMinutes
        watchForChanges
        autoOrganize
        namingPattern
        scanning
        lastScannedAt
        createdAt
        updatedAt
        shows {
          pageInfo {
            totalCount
          }
        }
        showArtwork: shows(
          orderBy: { updatedAt: DESC }
          page: { limit: 8, offset: 0 }
        ) {
          edges {
            node {
              id
              posterUrl
            }
          }
        }
        movies {
          pageInfo {
            totalCount
          }
        }
        movieArtwork: movies(
          orderBy: { updatedAt: DESC }
          page: { limit: 8, offset: 0 }
        ) {
          edges {
            node {
              id
              collectionPosterUrl
            }
          }
        }
        albums {
          pageInfo {
            totalCount
          }
        }
        albumArtwork: albums(
          orderBy: { updatedAt: DESC }
          page: { limit: 8, offset: 0 }
        ) {
          edges {
            node {
              id
              coverUrl
            }
          }
        }
        audiobooks {
          pageInfo {
            totalCount
          }
        }
        audiobookArtwork: audiobooks(
          orderBy: { updatedAt: DESC }
          page: { limit: 8, offset: 0 }
        ) {
          edges {
            node {
              id
              coverUrl
            }
          }
        }
      }
      cursor
    }
    pageInfo {
      hasNextPage
      totalCount
    }
  }
}

subscription LibraryChanged($filter: SubscriptionFilterInput) {
  libraryChanged(filter: $filter) {
    action
    id
    library {
      id
      name
      path
      libraryType
      icon
      color
      autoScan
      scanIntervalMinutes
      watchForChanges
      scanning
      lastScannedAt
      createdAt
      updatedAt
    }
  }
}

mutation CreateLibrary($input: CreateLibraryInput!) {
  createLibrary(input: $input) {
    success
    error
    library {
      id
      name
      path
      libraryType
      icon
      color
    }
  }
}

mutation DeleteLibrary($id: String!) {
  deleteLibrary(id: $id) {
    success
    error
  }
}

mutation ScanLibrary($id: String!) {
  scanLibrary(id: $id) {
    success
    status
    message
    scanRunId
  }
}

mutation RetryScanIssue($issueId: String!) {
  retryScanIssue(issueId: $issueId) {
    success
    queued
    message
  }
}

mutation ResolveScanIssue($issueId: String!, $resolution: String!) {
  resolveScanIssue(issueId: $issueId, resolution: $resolution) {
    success
    queued
    message
  }
}

mutation TrashDuplicateScanIssue($issueId: String!) {
  trashDuplicateScanIssue(issueId: $issueId) {
    success
    message
    oldPath
    trashPath
  }
}

query Libraries(
  $Where: LibraryWhereInput
  $OrderBy: [LibraryOrderByInput!]
  $Page: PageInput
) {
  Libraries: libraries(where: $Where, orderBy: $OrderBy, page: $Page) {
    Edges: edges {
      Node: node {
        Id
        UserId
        Name
        Path
        LibraryType
        Icon
        Color
        AutoScan
        ScanIntervalMinutes
        WatchForChanges
        AutoOrganize
        NamingPattern
        Scanning
        LastScannedAt
        CreatedAt
        UpdatedAt
        Shows: shows {
          PageInfo: pageInfo {
            TotalCount: totalCount
          }
        }
        ShowArtwork: shows(
          orderBy: { UpdatedAt: DESC }
          page: { limit: 8, offset: 0 }
        ) {
          Edges: edges {
            Node: node {
              Id
              PosterUrl
            }
          }
        }
        Movies: movies {
          PageInfo: pageInfo {
            TotalCount: totalCount
          }
        }
        MovieArtwork: movies(
          orderBy: { UpdatedAt: DESC }
          page: { limit: 8, offset: 0 }
        ) {
          Edges: edges {
            Node: node {
              Id
              CollectionPosterUrl
            }
          }
        }
        Albums: albums {
          PageInfo: pageInfo {
            TotalCount: totalCount
          }
        }
        AlbumArtwork: albums(
          orderBy: { UpdatedAt: DESC }
          page: { limit: 8, offset: 0 }
        ) {
          Edges: edges {
            Node: node {
              Id
              CoverUrl
            }
          }
        }
        Audiobooks: audiobooks {
          PageInfo: pageInfo {
            TotalCount: totalCount
          }
        }
        AudiobookArtwork: audiobooks(
          orderBy: { UpdatedAt: DESC }
          page: { limit: 8, offset: 0 }
        ) {
          Edges: edges {
            Node: node {
              Id
              CoverUrl
            }
          }
        }
      }
      Cursor: cursor
    }
    PageInfo: pageInfo {
      HasNextPage: hasNextPage
      TotalCount: totalCount
    }
  }
}

subscription LibraryChanged($Filter: SubscriptionFilterInput) {
  LibraryChanged: libraryChanged(filter: $Filter) {
    Action: action
    Id: id
    Library: library {
      Id
      Name
      Path
      LibraryType
      Icon
      Color
      AutoScan
      ScanIntervalMinutes
      WatchForChanges
      Scanning
      LastScannedAt
      CreatedAt
      UpdatedAt
    }
  }
}

mutation CreateLibrary($Input: CreateLibraryInput!) {
  CreateLibrary: createLibrary(input: $Input) {
    Success: success
    Error: error
    Library: library {
      Id
      Name
      Path
      LibraryType
      Icon
      Color
    }
  }
}

mutation DeleteLibrary($Id: String!) {
  DeleteLibrary: deleteLibrary(id: $Id) {
    Success: success
    Error: error
  }
}

mutation ScanLibrary($Id: String!) {
  ScanLibrary(Id: $Id) {
    Success
    Message
  }
}

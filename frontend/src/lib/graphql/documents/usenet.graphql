query SettingsUsenetServers(
  $OrderBy: [UsenetServerOrderByInput!]
  $Page: PageInput
) {
  UsenetServers: usenetServers(orderBy: $OrderBy, page: $Page) {
    Edges: edges {
      Node: node {
        Id
        Name
        Host
        Port
        UseSsl
        Username
        Connections
        Priority
        Enabled
        RetentionDays
        LastSuccessAt
        LastError
        ErrorCount
      }
    }
  }
}

mutation SettingsUpdateUsenetServer(
  $Id: String!
  $Input: UpdateUsenetServerInput!
) {
  UpdateUsenetServer: updateUsenetServer(id: $Id, input: $Input) {
    Success: success
    Error: error
    UsenetServer: usenetServer {
      Id
      Enabled
      Priority
    }
  }
}

mutation SettingsCreateUsenetServer($Input: CreateUsenetServerInput!) {
  CreateUsenetServer: createUsenetServer(input: $Input) {
    Success: success
    Error: error
    UsenetServer: usenetServer {
      Id
      Name
      Host
      Port
      UseSsl
      Username
      Connections
      Priority
      Enabled
      RetentionDays
      LastSuccessAt
      LastError
      ErrorCount
    }
  }
}

mutation SettingsDeleteUsenetServer($Id: String!) {
  DeleteUsenetServer: deleteUsenetServer(id: $Id) {
    Success: success
    Error: error
  }
}

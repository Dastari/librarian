# Builds share a small machine with the backend and the live site: keep Gradle modest.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.daemon=false
org.gradle.caching=false
org.gradle.configuration-cache=false
android.useAndroidX=false
android.nonTransitiveRClass=true
# No Kotlin daemon: it would outlive the build (and, under the shared build lock, keep holding it).
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.enabled=false

[package]
name = "librarian-rehearsal-dispatch-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
path = "../rehearsal-dispatch.rs"

[dependencies]
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=2.0.119", features = ["full", "parsing", "extra-traits", "visit-mut"] }

[lints.rust]
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(feature, values("schema-export-only"))'] }

[advisories]
# Librarian configures agql-auth exclusively with HS256. The rsa crate is linked
# for agql-auth's optional RS256/OIDC paths, but Librarian never constructs those
# modes, so the vulnerable private-key operation is unreachable. There is no
# patched rsa release yet. See docs/dependency-advisory-exceptions.md.
# crypto-bigint (via jsonwebtoken's p256), ringbuf (via librqbit-utp) and zstd 0.13 (via
# graphql-orm-backup) have no fix reachable from this repository and no reachable vulnerable
# path; each is justified in docs/dependency-advisory-exceptions.md.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2026-0387",
    "RUSTSEC-2026-0293",
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0398",
]


[package]
name = "librarian"
version = "0.1.0"
edition = "2024"
authors = ["toby@dastari.net"]
description = "Rust backend for Librarian media library"
publish = false

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite", "graphql-orm/sqlite"]
embed-frontend = ["rust-embed"]

[dependencies]
# Web framework
axum = { version = "0.8.9", features = ["macros", "ws", "multipart"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs", "compression-gzip"] }

# Async runtime
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.19", features = ["io"] }

# GraphQL with subscriptions
async-graphql = { version = "7.2.1", features = ["uuid", "time", "tracing", "chrono", "dataloader"] }
async-graphql-axum = "7.2.1"
futures = "0.3.34"

# Native torrent client
librqbit = "9.0.1"

# Database - features controlled by crate features above
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "uuid", "time", "json", "chrono", "rust_decimal"] }

# File type detection (for artwork)
bytes = "1.12.1"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Error handling
thiserror = "2.0.20"
anyhow = "1.0.104"
async-trait = "0.1.92"

# Auth
agql-auth = { git = "https://github.com/Dastari/agql-auth", rev = "1d2e9fe2e1576105212a7b340a11abf8cad0382d", version = "0.19.0" }

# HTTP client
reqwest = { version = "0.13.4", features = ["json", "rustls", "cookies", "gzip", "deflate", "query", "stream"], default-features = false }

# File walking
walkdir = "2.5.0"

# GraphQL ORM
graphql-orm = { git = "https://github.com/Dastari/graphql-orm.git", rev = "39181034b02eca6a487eeadcf8d281aaf155a398", version = "0.30.0", default-features = false }
graphql-orm-storage = { git = "https://github.com/Dastari/graphql-orm.git", rev = "39181034b02eca6a487eeadcf8d281aaf155a398", version = "0.6.2", default-features = false, features = ["local"] }
graphql-orm-backup = { git = "https://github.com/Dastari/graphql-orm.git", rev = "39181034b02eca6a487eeadcf8d281aaf155a398", version = "0.7.2", default-features = false, features = ["local"] }

# Utilities
regex = "1.13.1"
same-file = "1.0.6"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
once_cell = "1.21.4"
parking_lot = "0.12.5"
url = "2.5.8"
ipnet = "2.12.1"

# Rate limiting and retry logic
governor = "0.10.4"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

# TUI dashboard
ratatui = "0.30.2"
crossterm = "0.29.0"

# System metrics
sysinfo = "0.39.6"

# Config
dotenvy = "0.15.7"
dirs = "6.0.0"
mime_guess = "2.0.5"
chrono = { version = "0.4.45", features = ["serde"] }
sha2 = "0.11.0"
hmac = "0.13.0"
hex = "0.4.3"
rust_decimal = { version = "1.43.0", features = ["serde"] }
rust-embed = { version = "8.12.0", optional = true }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }

# XML parsing for RSS feeds and Torznab responses
quick-xml = "0.42.0"

# HTML parsing for indexer scraping
scraper = "0.27.0"

# Credential encryption
aes-gcm = "0.11.1"
base64 = "0.23.1"
rand = "0.10.2"

# Chromecast/Google Cast support
rust_cast = { version = "0.21.0", path = "../vendor/rust_cast" }

# mDNS device discovery
mdns-sd = "0.21.1"
flume = "0.12.0"

# UPnP port forwarding
igd = "0.12.1"
local-ip-address = "0.6.13"
urlencoding = "2.1.3"
strsim = "0.11.1"
image = { version = "0.25.10", features = ["jpeg", "png", "webp"] }
libc = "0.2.189"

# Archive extraction (docs/design.md "Archive Extraction").
# Pure-Rust for zip/7z; `unrar` statically links the vendored RARLAB unrar
# C++ source, so no external `unrar`/`7z`/`unzip` binary is required.
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "lzma", "xz", "time"] }
sevenz-rust2 = { version = "0.22.2", default-features = false, features = ["util", "compress", "aes256", "bzip2", "ppmd"] }
unrar = "0.5.8"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[dev-dependencies]
tokio-test = "0.4.5"
tempfile = "3.27.0"
assert_matches = "1.5.0"
pretty_assertions = "1.4.1"
# regex is already a main dependency, but we use it in tests too

[patch.crates-io]
# async-graphql 7.2.1 pins an LRU line affected by RUSTSEC-2026-0253.
# Only its lru requirement differs from the registry source; see vendor/async-graphql/PATCH.md.
async-graphql = { path = "../vendor/async-graphql" }

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'unwind'
strip = true

[package]
name = "librarian"
version = "0.6.0"
edition = "2024"
authors = ["toby@dastari.net"]
description = "Rust backend for Librarian media library"
publish = false

[package.metadata.cargo-machete]
# This optional proc-macro dependency intentionally unifies the host feature
# used by the ORM's transitive derive crate; application source does not import it.
ignored = ["graphql-orm-macros"]

[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite", "graphql-orm/sqlite"]
embed-frontend = ["rust-embed"]
# Tooling only: same patched proc-macro package as the ORM's dependency.
schema-export-only = ["dep:graphql-orm-macros", "graphql-orm-macros/schema-export-only"]

[dependencies]
# Web framework
axum = { version = "0.8.9", features = ["macros", "ws", "multipart"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs", "compression-gzip"] }

# Async runtime
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = { version = "0.7.20", features = ["io", "io-util"] }

# GraphQL with subscriptions
async-graphql = { version = "7.2.1", features = ["uuid", "time", "tracing", "chrono", "dataloader"] }
async-graphql-axum = "7.2.1"
futures = "0.3.34"

# Native torrent client
librqbit = "9.1.0"

# Database - features controlled by crate features above
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "uuid", "time", "json", "chrono", "rust_decimal"] }

# File type detection (for artwork)
bytes = "1.12.1"

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"
async-trait = "0.1.92"

# Auth
agql-auth = { git = "https://github.com/Dastari/agql-auth.git", tag = "v0.25.0", version = "0.25.0" }

# HTTP client
reqwest = { version = "0.13.5", features = ["json", "rustls", "cookies", "gzip", "deflate", "query", "stream"], default-features = false }

# File walking
walkdir = "2.5.0"
# SMB client for libraries on a network share (docs/design.md Q85). Pure Rust, no mounts.
smb2 = "0.43.0"
# Change notification for libraries on this machine (inotify on Linux); shares use SMB2
# CHANGE_NOTIFY through smb2 (docs/design.md Q115).
notify = { version = "8.2.2", default-features = false }

# GraphQL ORM
# Optional direct edge unifies this host proc-macro feature with the git patch below.
graphql-orm-macros = { path = "../vendor/graphql-orm-macros", version = "=0.89.0", default-features = false, optional = true }
graphql-orm = { git = "https://github.com/Dastari/graphql-orm.git", tag = "workspace-2026.11.01.1", version = "0.89.0", default-features = false }
graphql-orm-storage = { git = "https://github.com/Dastari/graphql-orm.git", tag = "workspace-2026.11.01.1", version = "0.8.0", default-features = false, features = ["local"] }
graphql-orm-backup = { git = "https://github.com/Dastari/graphql-orm.git", tag = "workspace-2026.11.01.1", version = "0.12.0", default-features = false, features = ["local"] }

# Utilities
regex = "1.13.1"
same-file = "1.0.6"
uuid = { version = "1.29.1", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
once_cell = "1.21.4"
parking_lot = "0.13.0"
url = "2.5.8"
ipnet = "2.12.2"

# Rate limiting and retry logic
governor = "0.10.4"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

# TUI dashboard
ratatui = "0.30.2"
crossterm = "0.29.0"

# System metrics
sysinfo = "0.40.1"

# Config
dotenvy = "0.15.7"
dirs = "7.0.0"
mime_guess = "2.0.5"
chrono = { version = "0.4.45", features = ["serde"] }
# Subtitle files in the author's code page (old SubRip files), decoded without ffmpeg.
encoding_rs = "0.8.44"
chardetng = "1.0.0"
# Lyrics tags (USLT/SYLT, LYRICS, ©lyr), read through the storage layer.
lofty = "0.25.5"
sha2 = "0.11.1"
hmac = "0.13.0"
hex = "0.4.3"
# Server self-upgrade (services::updates): release version ordering and the .tar.gz archive.
semver = "1.0.28"
flate2 = "1.1.11"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
rust-embed = { version = "8.13.0", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring"] }

# XML parsing for RSS feeds and Torznab responses
quick-xml = "0.42.0"

# HTML parsing for indexer scraping
scraper = "0.29.0"

# Credential encryption
aes-gcm = "0.11.1"
base64 = "0.23.1"
rand = "0.10.3"

# Chromecast/Google Cast support
rust_cast = { version = "0.21.0", path = "../vendor/rust_cast" }

# mDNS device discovery
mdns-sd = "0.21.7"
flume = "0.12.0"

# UPnP port forwarding
igd = "0.12.1"
local-ip-address = "0.6.13"
# Cast discovery: SSDP searches go out of each LAN interface (IP_MULTICAST_IF).
socket2 = "0.6.5"
urlencoding = "2.1.3"
strsim = "0.11.1"
image = { version = "0.25.10", features = ["jpeg", "png", "webp"] }
libc = "0.2.191"

# Archive extraction (docs/design.md "Archive Extraction").
# Pure-Rust for zip/7z; `unrar` statically links the vendored RARLAB unrar
# C++ source, so no external `unrar`/`7z`/`unzip` binary is required.
zip = { version = "9.4.2", default-features = false, features = ["deflate", "deflate64", "bzip2", "zstd", "lzma", "xz", "time"] }
sevenz-rust2 = { version = "0.25.0", default-features = false, features = ["util", "compress", "aes256", "bzip2", "ppmd"] }
unrar = "0.5.8"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[dev-dependencies]
tokio-test = "0.4.6"
tempfile = "3.27.0"
assert_matches = "1.5.0"
pretty_assertions = "1.4.1"
# graphql-ws client for the generated-subscription contract test
# (`tests/api_entities.rs`); already in the lock graph via axum's `ws` feature.
tokio-tungstenite = "0.29.0"
# TOTP codes for the two-factor sign-in tests (RFC 6238 uses HMAC-SHA1); both are already in
# the lock graph through agql-auth.
sha1 = "0.10.6"
hmac-sha1-compat = { package = "hmac", version = "0.12.1" }
# regex is already a main dependency, but we use it in tests too

[patch.crates-io]
# async-graphql 7.2.1 pins an LRU line affected by RUSTSEC-2026-0253.
# Only its lru requirement differs from the registry source; see vendor/async-graphql/PATCH.md.
async-graphql = { path = "../vendor/async-graphql" }

[patch."https://github.com/Dastari/graphql-orm.git"]
# Tooling only: the schema-export-only feature; see vendor/graphql-orm-macros/PATCH.md.
graphql-orm-macros = { path = "../vendor/graphql-orm-macros" }

# The live backend is a debug build. SMB signing and encryption run in these crates, and unoptimised
# they cap a share at about 35 MiB/s (about 300 MiB/s optimised), so they are always optimised.
[profile.dev.package.smb2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.aes-gcm]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3
[profile.dev.package.polyval]
opt-level = 3
[profile.dev.package.ctr]
opt-level = 3
[profile.dev.package.ccm]
opt-level = 3
[profile.dev.package.cmac]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.md-5]
opt-level = 3
[profile.dev.package.md4]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.lz4_flex]
opt-level = 3

[profile.release]
opt-level = 'z'
lto = true
codegen-units = 1
panic = 'unwind'
strip = true

[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
# See docs/dependency-advisory-exceptions.md. Librarian uses agql-auth's HS256
# mode only; the affected RSA private-key path is not configured.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true
# agql-auth is a private, commit-pinned application dependency without public
# license metadata. Do not infer or assert a license that its owner has not
# declared.
ignore-sources = ["https://github.com/Dastari/agql-auth"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/Dastari/agql-auth",
    "https://github.com/Dastari/graphql-orm.git",
]

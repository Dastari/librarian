[graph]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
# See docs/dependency-advisory-exceptions.md. Librarian uses agql-auth's HS256
# mode only; the affected RSA private-key path is not configured.
ignore = [
    "RUSTSEC-2023-0071", # rsa, unreachable (HS256 only)
    "RUSTSEC-2026-0387", # crypto-bigint via p256, unreachable (HS256 only)
    "RUSTSEC-2026-0293", # ringbuf via librqbit-utp, elements are u8
    "RUSTSEC-2026-0391", # zstd 0.13 via graphql-orm-backup, no reused contexts
    "RUSTSEC-2026-0403", # zstd-safe 7 via graphql-orm-backup, local self-written backups
    "RUSTSEC-2026-0398", # zstd-safe 7 Seekable API, unused
    # zstd-safe 7 unsound-API notices via graphql-orm-backup; none of these APIs are called.
    "RUSTSEC-2026-0395",
    "RUSTSEC-2026-0396",
    "RUSTSEC-2026-0397",
    "RUSTSEC-2026-0399",
    "RUSTSEC-2026-0400",
    "RUSTSEC-2026-0401",
    "RUSTSEC-2026-0402",
    "RUSTSEC-2026-0404",
    "RUSTSEC-2026-0405",
    "RUSTSEC-2026-0406",
]

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # bzip2-sys (via the zip and sevenz-rust2 archive support); permissive BSD-style.
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = true
# agql-auth is a private, commit-pinned application dependency without public
# license metadata. Do not infer or assert a license that its owner has not
# declared.
ignore-sources = ["https://github.com/Dastari/agql-auth"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/Dastari/agql-auth",
    "https://github.com/Dastari/graphql-orm.git",
]
